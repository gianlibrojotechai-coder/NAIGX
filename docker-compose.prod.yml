# NAIGX production stack — `M-19` Phase 2, topology per [D-50](docs/25-D-50-Deployment-Topology.md).
#
# One instance, no staging. Caddy terminates TLS at the edge; the application
# and both databases are reachable only on this file's private network.
#
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# ⚠️ MIGRATIONS ARE NOT APPLIED ON BOOT — `SA §9.3` requires them to be
# reversible independently of code, which they cannot be if starting the app is
# what runs them. Apply them deliberately, before bringing the app up:
#
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env \
#     run --rm migrate
#
# `docker-compose.yml` (unsuffixed) remains the DEVELOPMENT database only. This
# file is standalone and does not extend it.

name: naigx

services:
  # -------------------------------------------------------------------------
  # Data tier — one Postgres server, two databases (`DB §1.4`).
  #
  # `scripts/init-trace-db.sql` creates the trace database, and it runs ONLY on
  # first initialisation of an empty volume. On an existing volume, create it
  # by hand — the command is in that script.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: naigx-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-naigx}

    # ⚠️ NO `ports:`, DELIBERATELY. The development compose publishes 5432 to
    # the host; a production database that does the same is reachable from the
    # internet the moment the host's firewall is anything less than perfect.
    # Nothing outside this network needs it — `psql` runs via `docker exec`.

    volumes:
      - naigx_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-trace-db.sql:/docker-entrypoint-initdb.d/10-init-trace-db.sql:ro

    healthcheck:
      # Both databases, not just the primary. A server that answers for `naigx`
      # while `naigx_trace` was never created would pass a one-database check
      # and then fail every trace write at runtime.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && pg_isready -U $$POSTGRES_USER -d naigx_trace",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks: [naigx]

  # -------------------------------------------------------------------------
  # Migrations — one-shot, run explicitly, never on boot.
  # -------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
    image: naigx-backend:latest
    profiles: ["migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naigx}
      TRACE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/naigx_trace
    # Both stores, in one command (`DB §1.4` — two schemas, two clients).
    command: ["npm", "run", "prisma:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [naigx]

  # -------------------------------------------------------------------------
  # Encryption operations — one-shot, run explicitly (`DB §13.1` row 3, D-52).
  #
  #   docker compose ... run --rm encrypt init      # create key version 1
  #   docker compose ... run --rm encrypt backfill  # seal existing rows
  #   docker compose ... run --rm encrypt status    # confirm none remain
  #
  # ⚠️ THE BACKFILL CANNOT BE PART OF THE SQL MIGRATION. Sealing a row needs the
  # data key, which needs a call to the key service, which SQL cannot make. So
  # between `migrate` and `encrypt backfill` the tables hold a MIXTURE of sealed
  # and plaintext values — reads handle both, which means nothing misbehaves and
  # nothing tells you. `encrypt status` is the only signal that the window has
  # closed.
  # -------------------------------------------------------------------------
  encrypt:
    build:
      context: ./backend
    image: naigx-backend:latest
    profiles: ["encrypt"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naigx}
      TRACE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/naigx_trace
      NAIGX_IP_HASH_SECRET: ${NAIGX_IP_HASH_SECRET:?NAIGX_IP_HASH_SECRET is required}
      # The PATH to the root key, never key material (D-61).
      NAIGX_KEY_FILE: /run/secrets/naigx/root.key

    # ⚠️ THE ROOT KEY, AND `encrypt init` IS THE ONE COMMAND THAT CREATES A
    # RING WITH IT. Running `init` a second time would not rotate anything —
    # it would start a new ring with no relationship to rows sealed under the
    # first, which is why the command refuses when a key already exists.
    #
    # Read-only, and the host path lives outside the repository and the build
    # context so it can never be committed or captured into an image layer.
    volumes:
      - ${NAIGX_KEY_FILE:?NAIGX_KEY_FILE is required — see D-61 §5}:/run/secrets/naigx/root.key:ro

    # ⚠️ THE COMPILED ENTRY POINT, NOT `tsx`. The runtime image prunes dev
    # dependencies and ships no `scripts/` directory, so `npx tsx` here would
    # fail at deploy time — which is why `encrypt.ts` lives under `src/`.
    entrypoint: ["/usr/bin/tini", "--", "node", "dist/ops/encrypt.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [naigx]

  # -------------------------------------------------------------------------
  # Fragment publisher — one-shot, `DB §4.5` / `docs/12` D-24.
  # -------------------------------------------------------------------------
  #
  # ⚠️ NO DOCKERFILE CHANGE, AND THAT IS DELIBERATE. `prompts/` and `research/`
  # are bind-mounted read-only rather than baked in, for two reasons: they are
  # authored content and evidence artifacts rather than application code, and
  # `prompts/` sits OUTSIDE the backend build context (`./backend`), so a
  # `COPY` could not reach it without pulling the whole repository into every
  # image build.
  #
  # ⚠️ The activation gate is unchanged. Publishing requires a real reference
  # naming a passing regression run that exercised the fragments being
  # activated; this service supplies no default and manufactures nothing.
  fragments:
    build:
      context: ./backend
    image: naigx-backend:latest
    profiles: ["fragments"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naigx}
      TRACE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/naigx_trace
      NAIGX_IP_HASH_SECRET: ${NAIGX_IP_HASH_SECRET:?NAIGX_IP_HASH_SECRET is required}
      NAIGX_KEY_FILE: /run/secrets/naigx/root.key

    volumes:
      - ${NAIGX_KEY_FILE:?NAIGX_KEY_FILE is required — see D-61 §5}:/run/secrets/naigx/root.key:ro
      # Mounted at `/` because the compiled modules resolve these three levels
      # up from `dist/`, the same way `corpus.ts` and `recording-store.ts` do.
      - ./prompts:/prompts:ro
      - ./research:/research:ro

    # The compiled entry point, not `tsx scripts/` — the runtime image ships
    # neither the scripts directory nor a dev dependency to run it.
    entrypoint: ["/usr/bin/tini", "--", "node", "dist/ops/fragments.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [naigx]

  # -------------------------------------------------------------------------
  # Artifact schema publisher — one-shot, `DB §4.4` / `FR-039`.
  #
  #   docker compose ... run --rm schemas publish   # publish the authored set
  #   docker compose ... run --rm schemas check     # verify, writes nothing
  #
  # ⚠️ REQUIRED BEFORE ANY ARTIFACT CAN BE STORED. `requirePublishedSchemaId`
  # refuses rather than publishing on demand, so a database that has never
  # been given the schemas fails every artifact-bearing path at Stage 9 while
  # the four stages before it succeed. Found on the deployed instance
  # 2026-09-09; the first-deploy runbook now includes this step.
  #
  # The schemas are baked into the image (`backend/Dockerfile`) — they are
  # application content with nothing sealed, unlike prompts/ and research/.
  # -------------------------------------------------------------------------
  schemas:
    build:
      context: ./backend
    image: naigx-backend:latest
    profiles: ["schemas"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naigx}
    entrypoint: ["/usr/bin/tini", "--", "node", "dist/ops/schemas.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [naigx]

  # -------------------------------------------------------------------------
  # Application tier.
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    image: naigx-backend:latest
    container_name: naigx-backend
    restart: unless-stopped

    # ⚠️ THIS LINE IS WHAT MAKES PHASE 1 REAL. The image runs non-root with
    # `chromiumSandbox: true`, and Chromium's namespace sandbox needs syscalls
    # Docker's default profile denies. Without this the PDF export fails to
    # launch a browser — and the whole point of Phase 1 was that the sandbox is
    # actually engaged, not merely that a PDF comes out. See
    # `deploy/seccomp/README.md` for what the profile trades.
    security_opt:
      - seccomp=./deploy/seccomp/chromium.json

    # ⚠️ NO `ports:`, DELIBERATELY — and this, not the bind address, is what
    # keeps the app off the internet. `HOST` stays at its `0.0.0.0` default
    # because inside a container that means "every interface of THIS
    # container", which is exactly what Caddy needs to reach it. Setting
    # `HOST=127.0.0.1` here would not harden anything; it would make the app
    # unreachable from the proxy. Loopback is the right value for a bare
    # process sharing a host with its proxy, which is not this topology.

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naigx}
      TRACE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/naigx_trace

      # ⚠️ MUST BE `true` HERE, AND ONLY HERE. Caddy is the socket peer for
      # every request, so without this `request.ip` is Caddy for everybody: the
      # per-IP authentication limit becomes one shared bucket and every session
      # row records the proxy's address. Set on an unproxied instance it is
      # worse — `X-Forwarded-For` becomes client-controlled and the per-IP
      # limit stops existing. It is `true` in this file because this file is
      # the one that puts a proxy in front.
      TRUST_PROXY: "true"

      # `DB §4.1` — raw IP is never persisted, `DB §13` classifies `ip_hash`
      # Pseudonymous. The application refuses to start under NODE_ENV=production
      # without this, because its development default is a constant published in
      # this repository and IPv4 enumerates against it in seconds.
      NAIGX_IP_HASH_SECRET: ${NAIGX_IP_HASH_SECRET:?NAIGX_IP_HASH_SECRET is required}

      # D-48. Absent means the internal surface is disabled, which is a valid
      # production posture — Phase 4 needs it set to scrape metrics.
      NAIGX_OPERATOR_TOKEN: ${NAIGX_OPERATOR_TOKEN:-}

      # `DB §13.1` row 3 — application-level encryption, keyed from a host-held
      # root key (D-61). REQUIRED: the application refuses to start under
      # NODE_ENV=production without it, and there is deliberately no in-process
      # fallback — an instance that minted its own key would seal content
      # nothing else could ever open, while looking perfectly healthy.
      #
      # ⚠️ THIS IS A PATH, NEVER KEY MATERIAL. The file is mounted read-only
      # below; its contents never enter configuration, logs or diagnostics.
      #
      # ⚠️ Losing this file destroys the encrypted fields and every backup of
      # them. Back it up separately from the database dumps — a backup that
      # contains both is a backup that protects neither.
      NAIGX_KEY_FILE: /run/secrets/naigx/root.key

      # Same origin behind the edge, so this allows nothing new; it is set so a
      # request that somehow arrives cross-origin is still refused correctly.
      CORS_ORIGIN: https://${NAIGX_DOMAIN:?NAIGX_DOMAIN is required}

      LOG_LEVEL: ${LOG_LEVEL:-info}

      # ⚠️ `NAIGX_EXECUTION_MODE` IS INTENTIONALLY UNSET. Unset resolves to
      # replay, which bills nothing. The standing no-provider-spend constraint
      # means this file must not be the place a metered mode gets switched on
      # by default.

    # ⚠️ THE ROOT KEY, READ-ONLY. The host path lives OUTSIDE the repository
    # and the build context so it can never be captured into an image layer or
    # committed.
    #
    # ⚠️ Only THIS service and `encrypt` receive it. Not `postgres`, not
    # `edge`, not `prometheus`, not `alertmanager`, not `backup` — `edge`
    # terminates TLS and faces the internet, and has no reason to hold the key
    # that unseals every stored analysis.
    #
    # Mounted rather than passed as an environment variable on purpose: env
    # vars are visible in `docker inspect` and in /proc/<pid>/environ, and this
    # is key material rather than a path (D-61 §5).
    volumes:
      - ${NAIGX_KEY_FILE:?NAIGX_KEY_FILE is required — see D-61 §5}:/run/secrets/naigx/root.key:ro
      # The recorded corpus a REPLAY instance serves from (D-62): the golden
      # corpus, the canonical recording store and the capability profile. The
      # compiled modules resolve `research/` three levels up from `dist/`, which
      # in the image is `/` — the same mount the `fragments` service uses.
      # Read-only: the runtime reads evidence, it never writes it. Without this
      # mount the instance starts, serves nothing, and readiness says so.
      #
      # ⚠️ Not `prompts/`. The runtime composes from the PUBLISHED fragments in
      # the database, never from disk; a recording is served only when the
      # published composition reproduces the one it was captured against
      # (`src/regression/replay-corpus.ts`).
      - ./research:/research:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks: [naigx]

  # -------------------------------------------------------------------------
  # Edge — static client and API routing, behind the host's shared Traefik.
  # -------------------------------------------------------------------------
  #
  # ⚠️ THIS SERVICE NO LONGER TERMINATES TLS AND NO LONGER BINDS HOST PORTS
  # (D-60). The host already runs an n8n/Traefik stack holding :80 and :443,
  # and both could not have them. Traefik terminates TLS and routes by
  # hostname; Caddy keeps every application-level job D-54 gave it — the SPA,
  # `try_files` fallback, `@api` routing, and the `/internal/*` 404.
  edge:
    build:
      # The repository root: this image needs `frontend/` and
      # `deploy/Caddyfile`, which have no common subdirectory.
      context: .
      dockerfile: deploy/Dockerfile.edge
    image: naigx-edge:latest
    container_name: naigx-edge
    restart: unless-stopped

    # ⚠️ NO `ports:`, AND THAT IS THE POINT (D-60 §4). Publishing :80/:443
    # here would collide with the Traefik that already holds them and take
    # n8n down with it. Traefik reaches this container over the shared
    # `n8n_default` network instead; nothing needs to be exposed on the host.

    # ⚠️ NO `NAIGX_DOMAIN`/`ACME_EMAIL` EITHER. The Caddyfile now listens on a
    # bare `:80` and requests no certificate, so passing an ACME contact would
    # advertise a responsibility this container no longer has.

    # Traefik discovers containers by label and ignores everything unlabelled
    # (`exposedbydefault=false`), so these lines — and only these — are what
    # make NAIGX reachable. n8n's own router is untouched.
    labels:
      - "traefik.enable=true"
      # ⚠️ REQUIRED because this container sits on TWO networks. Without it
      # Traefik may pick `naigx` and route to an address it cannot reach.
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.naigx.rule=Host(`${NAIGX_DOMAIN:?NAIGX_DOMAIN is required}`)"
      - "traefik.http.routers.naigx.entrypoints=web,websecure"
      - "traefik.http.routers.naigx.tls=true"
      # The resolver the existing Traefik already defines (TLS-ALPN-01).
      - "traefik.http.routers.naigx.tls.certresolver=mytlschallenge"
      # Caddy's internal port, not a host port.
      - "traefik.http.services.naigx.loadbalancer.server.port=80"

    volumes:
      # Caddy still keeps state here. ⚠️ It no longer holds certificates —
      # those live in Traefik's `traefik_data` volume now, which is the one
      # that must survive a redeploy to avoid Let's Encrypt rate limits.
      - naigx_caddy_data:/data
      - naigx_caddy_config:/config

    depends_on:
      - backend

    networks: [naigx, n8n_default]

  # -------------------------------------------------------------------------
  # Monitoring and alerting — `M-19` Phase 4, `NFR-082`, `NFR-085`.
  #
  # Prometheus scrapes the application's own `/internal/metrics`, which has
  # emitted Prometheus text format since `M-16` — no exporter and no
  # translation layer. Alertmanager is what turns a firing rule into a message
  # a person receives; without it, alerting is a rule file nobody reads.
  #
  # ⚠️ NEITHER PUBLISHES A PORT. Both are reachable only on this network. The
  # metrics carry no user content (`API §11.1`, and the module has no field
  # content could occupy), but the operator token and the alert webhook are
  # both credentials, and a publicly reachable Prometheus hands over the second
  # to anyone who asks. Reach them with `docker compose port`-style tunnelling
  # or an SSH forward, not by opening 9090.
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: naigx-prometheus
    restart: unless-stopped

    # The operator token reaches Prometheus as a file, not as a config literal
    # or an image layer. D-48's credential gates every scrape.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$NAIGX_OPERATOR_TOKEN" > /etc/prometheus/operator-token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=90d

    environment:
      NAIGX_OPERATOR_TOKEN: ${NAIGX_OPERATOR_TOKEN:?NAIGX_OPERATOR_TOKEN is required for monitoring}

    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - naigx_prometheus_data:/prometheus

    depends_on:
      - backend

    networks: [naigx]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: naigx-alertmanager
    restart: unless-stopped

    # ⚠️ THE WEBHOOK URL IS WRITTEN TO A FILE, because Alertmanager does no
    # environment expansion in its config — `url: "${VAR}"` would post every
    # alert to that literal string and log the failure where nobody looks.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$NAIGX_ALERT_WEBHOOK" > /etc/alertmanager/webhook-url
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager

    environment:
      NAIGX_ALERT_WEBHOOK: ${NAIGX_ALERT_WEBHOOK:?NAIGX_ALERT_WEBHOOK is required — an alert that fires into nothing is not alerting}

    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - naigx_alertmanager_data:/alertmanager

    networks: [naigx]

  # -------------------------------------------------------------------------
  # Backups — scheduled dumps of BOTH databases (`D-51` §4).
  #
  # ⚠️ THE DUMPS ARE WRITTEN TO A BIND MOUNT, NOT A DOCKER VOLUME, and that is
  # the point: D-51 §4 requires backups stored **off the deployment host**, and
  # a Docker volume lives on exactly the host whose loss the backup exists to
  # survive. `NAIGX_BACKUP_DIR` should be a mount that leaves the machine —
  # object storage, a network share, an attached remote filesystem. Pointing it
  # at a local path satisfies the schedule and NOT the off-host requirement.
  # -------------------------------------------------------------------------
  backup:
    image: postgres:17
    container_name: naigx-backup
    restart: unless-stopped

    environment:
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-naigx}
      # `DBQ-7`, resolved at 7 days (D-51). Published in the data policy.
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}

    volumes:
      - ./deploy/backup.sh:/usr/local/bin/naigx-backup:ro
      - ${NAIGX_BACKUP_DIR:?NAIGX_BACKUP_DIR is required — see D-51 §4 on off-host storage}:/backups

    entrypoint: ["/bin/bash", "/usr/local/bin/naigx-backup", "loop"]

    depends_on:
      postgres:
        condition: service_healthy

    networks: [naigx]

volumes:
  naigx_postgres_data:
  naigx_caddy_data:
  naigx_caddy_config:
  naigx_prometheus_data:
  naigx_alertmanager_data:

networks:
  naigx:
    driver: bridge

  # The network the host's existing n8n/Traefik stack already runs on (D-60).
  # ⚠️ `external: true` means compose ATTACHES to it and never creates, owns or
  # removes it — `docker compose down` on this project must not be able to take
  # n8n's network with it.
  n8n_default:
    external: true
