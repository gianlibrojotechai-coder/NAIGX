# NAIGX Capability Profile
#
# What you have actually demonstrated, with evidence. Stage 7 compares a job
# description's extracted requirements against this file to decide whether to
# apply now or build first.
#
# AUTHORING RULES — these are enforced by the loader, not left to discipline:
#
#   1. Every capability needs at least one evidence item. A capability with no
#      evidence cannot be cited in a match, so it cannot influence a verdict.
#   2. `depth` is about what the evidence proves, not what you could probably do:
#        production   — running, used by someone other than you
#        demonstrated — built end to end and shown working (repo, Loom, docs)
#        familiar     — worked with it, no artifact that proves it
#      `familiar` is deliberately NOT matchable. Familiarity is not evidence,
#      and a gap analysis that accepts it will tell you to apply when you should
#      build. That is the expensive direction to be wrong in.
#   3. Evidence needs a locator (`url` or `path`) — something a hiring manager
#      could open. "I built one once" is not evidence.
#
# ONE SYSTEM, MANY CAPABILITIES. Every entry below is evidenced by the SAME
# production client automation — a live-selling inventory and invoicing system
# built in n8n and used in that client's real operations. They are not ten
# projects. They are ten independently matchable capabilities that one system
# demonstrates, and the granularity is deliberate: Stage 7 matches individual
# extracted job requirements, so a single coarse "built an n8n workflow" entry
# would fail to match a posting that asks for structured LLM output handling or
# operational state management by name.
#
# The published artifact is generalized to protect client confidentiality. The
# node graph, routing and transformation logic are unchanged from production;
# client identity, brand tables, sourcing data and customer-facing copy are not.
#
# DEPTH NOTE. All ten are `production` because the system runs in a real
# business's operations. Be aware of what the locator itself proves: the
# repository evidences the build, not the operation. A recorded walkthrough of a
# live run would close that gap and is the highest-value evidence to add next.

profile_version: profile-v1
owner: Gian Librojo

capabilities:
  - id: cap-001
    name: Multi-system workflow orchestration in n8n
    platforms: [n8n]
    depth: production
    evidence:
      - type: repo
        locator: https://github.com/gianlibrojotechai-coder/live-selling-inventory-invoicing
        description: >-
          Production client automation: 36 nodes orchestrating Telegram, Google
          Sheets and OpenAI in a single workflow with two flows behind a command
          router
      - type: doc
        locator: https://github.com/gianlibrojotechai-coder/live-selling-inventory-invoicing/blob/main/README.md#architecture
        description: >-
          Architecture section — flow diagram and the three structural decisions
          that shape the system

  - id: cap-002
    name: LLM integration in an operational workflow
    platforms: [n8n, OpenAI]
    depth: production
    evidence:
      - type: workflow
        locator: https://github.com/gianlibrojotechai-coder/live-selling-inventory-invoicing/blob/main/workflows/live-selling-inventory-invoicing.json
        description: >-
          Two gpt-4.1-mini calls on the live path — one load-bearing parser, one
          cosmetic generator — invoked as pipeline stages, not as a chatbot
      - type: doc
        locator: https://github.com/gianlibrojotechai-coder/live-selling-inventory-invoicing/blob/main/README.md#aillm-usage
        description: >-
          AI/LLM usage section, including the deliberate split between validated
