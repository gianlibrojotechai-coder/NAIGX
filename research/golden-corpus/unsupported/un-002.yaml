case_id: un-002
input_type: unsupported

content: |
  We're rolling out a new expenses policy across the company and I need help getting
  people to actually follow it.

  The policy itself is written and signed off by finance. The problem is adoption.
  Last time we changed a policy about half the team carried on doing it the old way
  for months, and the managers didn't chase it because they didn't want the
  conversation. We've got 90 people across three sites and a fairly informal culture.

  I'm thinking about how to communicate it, whether to run training sessions or just
  send it round, how to get the managers bought in first, and how we handle people who
  keep ignoring it after a few reminders. There's a bit of a workflow to it - who
  tells who, in what order, and what happens at each stage if someone doesn't comply.

  How would you approach the rollout?

