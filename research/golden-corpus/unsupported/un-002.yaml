case_character: near-boundary
special_class: unsupported

rationale: |
  Why this case exists. `un-001` tests confident rejection of something plainly out of
  scope. This tests the far more dangerous boundary: input that uses the vocabulary of
  the product's domain while lying outside it. `FR-092`'s decline path is only
  valuable if it fires on the hard cases, and the hard case is a "workflow" with no
  system in it.

  The failure modes it guards against run in both directions, and both are real:
  - **Over-acceptance.** A classifier keying on "workflow", "each stage", and "if
    someone doesn't comply" produces an architecture for a process that has no
    software in it. That is a fabricated analysis of the kind `PV §3.4` treats as a
    defect of the same severity as a wrong answer.
  - **Over-rejection.** The mirror risk is a classifier that learns to reject anything
    describing human steps, which would decline genuine requirements whose current
    process is manual. `br-006` is exactly such a case - a detailed manual process
    that *is* in scope, because it names systems to automate into. Read together, the
    two cases define the boundary from both sides.

  Why near-boundary rather than ambiguous. The established distinction applies: this
  has competing *surface* signals with decisive substance, not two complete competing
  readings. There is no reading of this input under which a system is being automated,
  so nothing genuinely competes. Contrast `ew-003`, where both readings are
  substantively complete and the correct behaviour is to ask.

  Expected behaviour. Decline with an explanation (`FR-092`), naming under `FR-005`
  what would bring such an input into scope - here, the systems the process would run
  on. A user in this position is one system away from a valid submission, and a
  decline that says so is materially more useful than one that does not.

  Confidence `low`, per the `docs/11` A-9 convention. See `un-001`.

provenance:
  origin: synthetic
  notes: >
    Authored for the corpus. Deliberately borrows automation vocabulary - "workflow",
    staged sequence, conditional escalation - while containing no system of any kind.

