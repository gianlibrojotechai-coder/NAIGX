expected_classification_confidence:
  bound: at_or_above_threshold
  threshold: 0.6
  rationale: >
    Near-boundary, not ambiguous, and the competing type is `business_requirement`.
    The surface signals pull hard toward scope: the submitter says "there's a bit of a
    workflow to it", describes a staged sequence with conditional branches ("what
    happens at each stage if someone doesn't comply"), gives a headcount and a site
    count, and asks how to approach it. Those are the shapes of an automation
    requirement.

    The substance is nonetheless decisive and one-directional: every actor is a human,
    every step is a conversation, and no system, integration, data flow, or automation
    platform appears anywhere. The problem is organisational adoption, not process
    automation. A correct classifier should reach `unsupported` without needing
    `FR-015` confirmation.

