case_character: central
special_class: unsupported

rationale: |
  First case in the `unsupported/` directory, authored under the `un-` convention
  approved 2026-08-12 (`docs/11` §5, ambiguity A-11).

  Classification. `FR-011` lists `unsupported` as one of five classification values,
  and `FR-092` requires that it trigger an explained decline without proceeding to
  reasoning. `API §9.3` classes this as `unsupported_input_type` 422 and states
  explicitly that it is **not a failure**: the request was well-formed and processed
  correctly, and the content is outside what the product analyses.

  Why this input and not something obviously absurd. A nonsense or empty input would
  test nothing interesting - any classifier rejects it. This input is articulate,
  detailed, quantified, and genuinely answerable by a general-purpose assistant. That
  is precisely what makes it the right test: the failure mode is not misclassifying
  gibberish, it is a system that helpfully answers a question outside its competence
  because the question was well-posed. `PV §3.1` scopes NAIGX to automation and
  workflow intelligence; a comparative unit-economics opinion is not that.

  It also carries surface vocabulary that could pull a weak classifier toward
  `business_requirement` - "business plan", numbers, a comparison between options, an
  explicit request for a recommendation. The distinguishing signal is that nothing is
  being automated and no system is involved.

  Expected behaviour. Decline with an explanation (`FR-092`). Under `FR-005` the
  decline must name what would make an input analysable rather than saying only that
  it cannot help - "invalid input" is explicitly unacceptable, and the same standard
  applies here.

  Confidence `low`. Recorded per the `docs/11` A-9 corpus convention: no analysis was
  produced, so no confident recommendation exists. Note the deliberate asymmetry with
  classification confidence, which is at or above threshold - the system is certain
  about the type and produces nothing. A-9 remains open by owner decision; `low` is a
  convention, not a requirement.

provenance:
  origin: synthetic
  notes: >
    Authored for the corpus. Deliberately well-formed and answerable by a
    general-purpose assistant, so the case tests scope discipline rather than
    input quality.

