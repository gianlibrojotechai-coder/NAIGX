case_id: un-001
input_type: unsupported

content: |
  Hi, I'm putting together a business plan for a coffee shop I want to open next year
  in Leeds. I've got a rough idea of the numbers but I'd like a second opinion.

  Rent on the unit I'm looking at is £2,200 a month plus business rates. I reckon on
  two full-time staff plus myself, and I'm budgeting about £45,000 for the fit-out
  including the espresso machine and seating. My accountant thinks I need six months
  of running costs in reserve before I sign anything.

  What I'd really like to know is whether the numbers stack up, and whether I'd be
  better off going for the smaller unit on the side street at £1,400 a month even
  though the footfall is much lower.

