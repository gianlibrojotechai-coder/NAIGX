  scale_version: complexity-v1
  reason: >
    The `complexity_score` artifact is expected. This case supplies the strongest
    signals in the corpus for several `docs/09` §1.1 factors - four routes with
    conditional logic, six integrated systems, cross-scenario handoff, and an unstable
    failure profile - but no authoritative rule maps route counts or integration
    counts onto 1-5 factor scores, and `docs/09` A-3 records that no calibration data
    exists. Corpus-wide deterministic assertions (`docs/11` §4.5) still apply.

expected_risk:
  status: not_determinable
  scale_version: risk-v1
  reason: >
    The `risk_assessment` artifact is expected, and this case describes realised harm
    with quantities - 23 stalled jobs, two wrong-specification production runs, two
    over-limit shipments. Even so, nothing in `docs/09` §2 maps a realised incident
    onto a severity or likelihood value. Asserting one would invent scoring guidance.

case_character: substantial
special_class: null

rationale: |
  Why substantial. First substantial case on the workflow path, completing that
  character for `existing_workflow`. It is the workflow-path counterpart to `br-006`
  and `ta-002`, and the opposite pole from `ew-004`.

  Expected substance. `FR-021` requires issues specific to the submitted workflow,
  each with severity and a concrete remediation. This case deliberately separates what
  the submitter knows from what they do not, and a good response must handle both
  differently:

  Stated defects, diagnosable from the text:
  - Route B's dependency on a human completing an Asana task, with no timeout or
    escalation - 23 stalled jobs is the realised cost.
  - Route C's silent fallthrough, which converts a lookup miss into a wrong
    specification rather than an error. Two production runs is the realised cost.
  - A Google Sheet used as an operational datastore past 40,000 rows, degrading on
    every route.
  - Cross-scenario state passed as a query parameter, with no correlation guarantee.

  Stated unknowns, which must be surfaced rather than resolved by assumption
  (`FR-044`): whether the Route A credit check is applied consistently, and the cause
  of weekly duplicate runs. The logs cannot distinguish failure from bypass - so a
  confident diagnosis of either is invented, and rubric criterion C-5 (Honest)
  requires saying so. This is the sharpest test in the corpus of whether unknowns are
  disclosed or filled with plausible defaults.

  The Q3 volume doubling is material to every remediation and easy to read past. A
  review that fixes the Sheet append without noting it fails at twice the volume has
  missed a stated constraint (rubric criterion C-4, Complete).

  `platform_comparison` remains in the expected set per `AI §9.1`, but the submitter
  states migration is off the table this year. A response recommending a platform
  change has ignored a stated constraint - the artifact should compare within the
  constraint, not against it.

  Confidence `high`. CF-1 is strong: route-level structure, six named systems, volume,
  age, incident counts, API latency, and a stated growth expectation. CF-4 is strong -
  1,100 orders a month, 23 incidents, 40,000 rows, two seconds per call. CF-7 is the
  one downward pressure, since two unknowns are stated. They are not capping, however:
  both concern diagnosis of specific defects rather than the analysis as a whole, and
  most of the review does not depend on resolving them. `AI §8.3` caps on *material*
  unknowns - material to the conclusion, not merely present.

