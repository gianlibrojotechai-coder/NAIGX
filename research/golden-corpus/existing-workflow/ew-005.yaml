case_id: ew-005
input_type: existing_workflow

content: |
  Review request: order-to-cash automation, Make.com

  Context. We're a B2B print supplier. This scenario has been live for 14 months and
  now handles about 1,100 orders a month. It was built in stages by three different
  people and nobody has reviewed it as a whole.

  Scenario structure, as it currently stands:

  Trigger: Webhook from our Shopify Plus store on order creation.

  Module 1 - Router with four routes, filtered on order tags:
    Route A: tag "trade" - accounts customers with credit terms
    Route B: tag "proof" - orders requiring artwork approval before production
    Route C: tag "reorder" - repeat orders referencing a previous job number
    Route D: fallback - everything else

  Route A: looks up the customer in Xero, checks credit limit via a custom API call,
  then either creates a sales order in our MIS (Tharstern) or, if over limit, sends an
  email to accounts and stops.

  Route B: uploads artwork files from the Shopify order to Dropbox, creates a proofing
  task in Asana, and waits. There's a second scenario that watches Asana for task
  completion and re-enters this flow via a webhook. The two scenarios pass a job
  reference to each other as a query parameter.

  Route C: searches Tharstern for the previous job number, copies its specification,
  and creates a new job. If the previous job isn't found it falls through to Route D
  silently.

  Route D: creates a generic job in Tharstern with a flag for manual review.

  All routes: append a row to a Google Sheet used for daily production planning, then
  post a summary into a Slack channel.

  What we know is wrong. Route B breaks if a customer replies to the proofing email
  instead of completing the Asana task - the job sits indefinitely and we only find it
  when the customer chases. We had 23 of those last quarter. The Google Sheet has
  passed 40,000 rows and appends now take several seconds each. Route C's silent
  fallthrough means we've produced reorders against the wrong specification twice.

  What we don't know. Whether the credit check in Route A is actually being applied
  consistently - we've had two orders ship to over-limit accounts and can't tell from
  the logs whether the check failed or was bypassed. Nobody understands why the
  scenario occasionally runs twice for the same order; it happens perhaps once a week.

  Constraints. Tharstern's API is read-heavy and slow, around two seconds a call.
  We're staying on Make.com - the team knows it and a migration isn't on the table
  this year. Order volume is expected to roughly double when we onboard a large
  contract in Q3.

