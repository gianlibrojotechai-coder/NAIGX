rationale: |
  Materially different from the other workflow-path cases by platform and by failure
  class. `ew-002` is n8n with a data-integrity failure, `ew-005` is Make with routing
  and scale failures, `ew-003` is Zapier with an unresolved fix-or-replace intent.
  This is Microsoft-native automation, where the dominant failures are **governance**
  rather than engineering: identity, ownership, and a hand-maintained lookup table.
  A corpus containing only iPaaS cases would miss that class entirely.

  Expected substance. `FR-021` requires issues specific to the submitted workflow with
  severity and concrete remediation. Four independently diagnosable defects, all
  evidenced:

  - The flow runs under a leaver's account, kept alive by a shared-mailbox conversion.
    This is the highest-consequence finding and is not a workflow-logic defect at all -
    it is an ownership and identity problem that would survive any redesign.
  - A 260-row hand-maintained Approval Matrix with a known stale-entry failure. The
    remediation is a data-ownership question, not a flow change.
  - No timeout on approval steps, producing indefinitely stalled requisitions and the
    duplicate-submission behaviour that explains the reconciliation discrepancy. The
    submitter has already connected the symptom to its cause; a response that reports
    the discrepancy as a separate problem has read carelessly.
  - Default retry configuration with silent failure under throttling, discovered three
    weeks late.

  The stated constraint - Microsoft stack, group IT policy, not the submitter's
  decision - bounds `platform_comparison` to comparison within the estate. A response
  recommending migration has ignored a stated constraint and fails rubric criterion
  C-1 (Grounded).

  Confidence `high`. CF-1 is strong: step-level structure, named connectors and lists,
  volume, approval threshold, list size, and four incidents with dates or counts.
  CF-4 is strong: 400 a month, £5,000 threshold, 260 rows, three misroutes, 30 failed
  runs. No capping condition applies (`AI §8.3`).

