case_id: ew-006
input_type: existing_workflow

content: |
  Power Automate flow review - purchase requisition approvals

  This flow has been running for about two years and IT inherited it when the person
  who built it left. It's business-critical and we're nervous about it.

  How it works: a form submission in Microsoft Forms starts the flow. The flow reads
  the requisition amount and requester's department from the form, looks up the
  approver in a SharePoint list called "Approval Matrix", and sends an approval
  request through the Approvals connector. If approved it writes a row to a SharePoint
  list called "Approved Requisitions" and emails procurement. If rejected it emails
  the requester. Over £5,000 it sends a second approval to the department head, in
  sequence, not parallel.

  Volume is around 400 requisitions a month.

  Our concerns:

  The flow runs under the leaver's account. It still works because their account was
  converted to a shared mailbox rather than deleted, but nobody is comfortable with
  that and our licensing review flagged it.

  The Approval Matrix list has 260 rows and is maintained by hand. When someone
  changes role, procurement usually remembers to update it, but we found three
  requisitions last year that went to someone who'd moved teams eight months earlier.

  There's no timeout on the approval steps. We have requisitions sitting in approval
  since March. The requesters assume they've been rejected and raise new ones, which
  is why the numbers don't reconcile.

  Retries are on the default. When SharePoint throttled us during a tenant migration
  in January, about 30 flow runs failed and we only found out from the run history
  three weeks later.

  We can't move off the Microsoft stack - it's a group IT policy decision, not ours.

