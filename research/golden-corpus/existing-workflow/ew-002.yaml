case_id: ew-002
input_type: existing_workflow

content: |
  Can you review this n8n workflow? It runs our nightly inventory sync.

  Nodes, in order:

  1. Schedule Trigger - cron 0 2 * * * (02:00 daily)
  2. HTTP Request - GET https://supplier-a.example/api/v2/stock
     Authentication: header auth, no timeout set, retryOnFail: false
  3. HTTP Request - GET https://supplier-b.example/api/stock.json
     Authentication: query parameter API key, no timeout set, retryOnFail: false
  4. Merge - mode: append
  5. Code (JavaScript) - normalises both payloads to {sku, qty, updated_at}
  6. Loop Over Items - batchSize: 1
  7. Shopify - "Update Inventory Level" node, one call per item
  8. IF - checks whether qty is 0
     true branch -> Slack "Send Message" to #ops saying the SKU is out of stock
     false branch -> NoOp

  Notes on how it behaves in practice. We have about 4,200 SKUs across the two
  suppliers. The workflow takes between 40 minutes and just over two hours to finish,
  and we have never worked out why the variance is so wide. Twice this quarter it was
  still running when staff arrived at 08:00.

  Supplier B changed a field name from quantity_available to qty_available in March
  without telling us. The Code node did not error - it just produced undefined for
  every SKU from that supplier, and step 7 wrote zeros into Shopify. We oversold
  about 40 lines before anyone noticed, because step 8 dutifully posted every one of
  them to Slack and the channel was already noisy enough that nobody read it.

  We would like to know what we should fix and in what order.

