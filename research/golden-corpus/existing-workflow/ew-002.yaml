  reason: >
    The `risk_assessment` artifact is expected, and this input describes a realised
    financial loss rather than a hypothetical exposure. Even so, nothing in
    `docs/09` §2 maps a described incident onto a severity or likelihood value.
    Asserting "severity 4" because overselling occurred would be inventing scoring
    guidance the specifications do not provide.

case_character: central
special_class: null

rationale: |
  Classification. A running automation submitted for review, with configuration and
  observed behaviour. Unambiguously `FR-021`.

  Artifact set. Workflow path per `AI §9.1`, identical to `ew-001`. Requirement-path
  artifacts are omitted on path grounds, P1 artifacts on priority grounds - the
  omission reasons preserve that distinction.

  Expected substance. `FR-021` requires issues specific to the submitted workflow and
  each issue to carry severity and a concrete remediation. This input contains five
  independently diagnosable defects, all evidenced in the text rather than inferred:

  - No timeout and `retryOnFail: false` on both HTTP nodes (steps 2-3), so a slow or
    failing supplier stalls or drops the run.
  - `batchSize: 1` with a per-item Shopify call across 4,200 SKUs (steps 6-7), which
    is the most plausible explanation for the 40-minute-to-two-hour variance.
  - No schema validation between the Code node and the write (steps 5-7), which is
    the direct cause of the zero-quantity incident.
  - Writing `undefined` as zero rather than failing closed - a data-integrity defect
    distinct from the missing validation.
  - Alerting into a channel already too noisy to read (step 8), so the detection
    control that existed did not function.

  The last is the one most likely to be missed, and the most valuable: the workflow
  did alert, and the alert was useless. A review that lists "add alerting" as a
  remediation has misread the evidence.

  `FR-021` also requires that a sound workflow yield an explicit statement that no
  material issues were found rather than manufactured criticism. This case cannot
  test that - it is deliberately unsound. A sound-workflow case remains unauthored
  and is recorded in the coverage gaps.

  Confidence `high`. CF-1 and CF-4 are strong: node-level configuration, SKU count,
  runtime range, a dated regression with its cause, and a quantified consequence.
  No capping condition applies (`AI §8.3`).

provenance:
  origin: synthetic
  notes: >
    Authored for the corpus. Node types and parameter names follow n8n conventions;
    supplier hostnames use the reserved example.com domain. No real workflow export.

