expected_confidence_band: medium

expected_classification_confidence:
  bound: at_or_above_threshold
  threshold: 0.6
  rationale: >
    Near-boundary, and the competing axis is one no other case tests: whether in-app
    CRM automation counts as an `existing_workflow`. The surface pull is toward
    `business_requirement` because of the closing paragraph - two new segments next
    quarter, and a suspicion that the current structure will not hold.

    The substance is decisive. `FR-021` covers an existing automation submitted for
    review, and this is one: named workflows, an enrolment structure, a branch
    condition, a suppression list, and two reported misbehaviours with complaints
    attached. The forward-looking paragraph asks whether the reviewed structure will
    scale, which is a review question, not a request for a new design. Unlike `ew-003`,
    the submitter is not undecided between fixing and replacing - they want it fixed
    and want to know if it will hold.

expected_complexity:
  status: not_determinable
  scale_version: complexity-v1
  reason: >
    The `complexity_score` artifact is expected. Multiple interacting workflows with
    enrolment and exit conditions are a strong Workflow Complexity signal, but no
    authoritative rule maps workflow interaction onto a 1-5 score and `docs/09` A-3
    records that no calibration data exists.

expected_risk:
  status: not_determinable
  scale_version: risk-v1
  reason: >
    The `risk_assessment` artifact is expected. Customers receiving prospect email is a
    stated, realised reputational incident, but nothing in `docs/09` §2 maps it onto a
    severity or likelihood value.

case_character: near-boundary
special_class: null

rationale: |
  Fourth near-boundary case, and deliberately a different axis from the other three.
  `ew-001` tested prose framing against running-system substance, `ta-003` informal
  framing against evaluation substance, `jd-003` an embedded problem against posting
  substance. This tests whether **native CRM automation** registers as a workflow at
  all, when no automation platform is named and the vocabulary is marketing-operations
  rather than engineering.

  That matters for the market this product serves. `JD-001` and `JD-003` in the
  research corpus both describe HubSpot workflow ownership as the job; a classifier
  that only recognises iPaaS tools as "workflows" would misclassify a large share of
  real submissions.

  Expected substance. `FR-021` requires issues specific to the submitted workflow.
  Two reported symptoms with distinct and diagnosable causes:

  - Contacts receiving both nurture sequences in one week. The stated exit-and-enrol
    branch at step three is the obvious place to look, and the question is whether
    exit criteria are actually set or only assumed.
  - Customers receiving the top-of-funnel sequence. The submitter has already framed
    the correct diagnostic fork - suppression not applied, versus enrolled before
    suppression - and a useful response should resolve which rather than restate both.

  The forward-looking question must be answered within the path constraint. The
  submitter suspects that adding two segments to the current structure will make things
  worse, and `FR-021`'s "optimization recommendations" cover exactly that. Ambiguity
  A-10 is live here: a structural recommendation is warranted, but
  `architecture_recommendation` is off-path.

  Confidence `medium`. CF-1 is moderate: workflow names, sequence shape, branch
  condition, volumes and spend are stated, but no enrolment trigger configuration, no
  exit criteria settings, no suppression list mechanics, and no score threshold
  definition - and those are precisely what the two defects turn on. CF-4 is mixed:
  strong on business figures (£14,000, 1,800 contacts), absent on configuration. No
  capping condition applies (`AI §8.3`); this is base confidence reflecting genuinely
  partial evidence about the failures being diagnosed.

provenance:
