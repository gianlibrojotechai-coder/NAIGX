case_id: ew-008
input_type: existing_workflow

content: |
  Our HubSpot lead nurture is doing something odd and I want to sort it out before we
  scale spend next quarter.

  Setup as it stands. A form fill sets Lifecycle Stage to Lead and enrols the contact
  in a workflow called "Nurture - Top of Funnel". That workflow has a five-email
  sequence with two-day delays, and a branch at step three: if the contact has visited
  the pricing page it exits and enrols them in "Nurture - Considering" instead. A
  separate workflow, "MQL Handoff", is triggered by a score threshold and creates a
  task for the owner plus a Slack notification.

  There's also a re-engagement workflow that enrols anyone with no activity in 90
  days, and a suppression list for customers and open opportunities.

  The odd behaviour. Some contacts are getting emails from both nurture workflows in
  the same week. We've had two complaints. Also, a handful of existing customers
  received the top-of-funnel sequence, which is embarrassing - they're on the
  suppression list, so either the list isn't being applied or they were enrolled
  before being added to it.

  We're spending about £14,000 a month on paid acquisition feeding this, and roughly
  1,800 new contacts a month come through it.

  Beyond fixing what's broken, I'd like a view on whether this structure holds up. We
  want to add two more segments next quarter and I suspect bolting them onto what we
  have will make it worse.

