rationale: |
  Materially different from the other workflow-path cases by platform class. `ew-002`,
  `ew-003`, `ew-005` and `ew-006` are iPaaS or workflow tools sitting *between* systems;
  `ew-007` is scripts and cron; `ew-008` is CRM-native. This is a **database-native
  automation estate** where the automations live inside the datastore itself, and the
  binding constraints are the platform's own execution and run limits rather than any
  integration boundary.

  Expected substance. `FR-021` requires issues specific to the submitted workflow with
  severity and concrete remediation. Four independently diagnosable defects, all
  evidenced in the text:

  - **Silent partial creation.** The script hits an execution time limit mid-run,
    leaving an unknown subset of Deliverables created. This is the most consequential
    finding: the failure is not that it errors, but that the partial result is
    indistinguishable from a complete one. The same shape as `ew-007`'s missing dealer
    file and `br-011`'s blank expiry field - absence that reads as normal.
  - **Alert fatigue by construction.** Hourly repetition until someone acts, and the
    producers have muted the channel. As in `ew-002`, the detection control exists and
    has been rendered inert - here by design rather than by noise.
  - **Point-in-time rate capture** with no revaluation for future bookings, producing
    the £4,000 discrepancy. This is a data-semantics defect, not a reliability one, and
    is the subtlest of the four.
  - **Unattributed run consumption** against a plan limit, with no visibility into
    which automation is responsible.

  The rate-capture issue deserves care in review. It is not straightforwardly a bug -
  capturing the rate at booking time is defensible for historical accuracy, and the
  submitter says as much. The defect is that advance bookings inherit stale rates
  silently. A review that recommends always reading the live rate would break the
  historical correctness the current design gets right, so this is a genuine trade-off
  rather than a fix, and rubric criterion C-6 (Defensible) applies.

  `platform_comparison` remains on the path per `AI §9.1`. No platform constraint is
  stated - unlike `ew-005` and `ew-006` - and the run-limit pressure makes the
  comparison genuinely live.

  Confidence `high`. CF-1 is strong: table record counts, four automations described at
  configuration level, three failures with mechanisms, and a quantified financial
  impact. CF-4 is strong: 900, 11,000, 8-20, 48 hours, hourly, £4,000. No capping
  condition applies (`AI §8.3`).

