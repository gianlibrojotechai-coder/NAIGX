case_id: ew-009
input_type: existing_workflow

content: |
  Review of our Airtable production tracking automations

  We're a video production company. Everything runs out of one Airtable base and it's
  grown well past what it was designed for.

  The base: a Projects table (about 900 records), a Shoots table, a Deliverables table
  (roughly 11,000 records), a Freelancers table, and a Clients table.

  The automations, as configured:

  1. When a Project record's Status changes to "Confirmed", a script action creates
     Shoot records from a template and generates Deliverable records - typically 8 to
     20 per project depending on the package field.

  2. When a Deliverable's Status changes to "Ready for Review", an automation sends a
     Slack message to the assigned producer and starts a 48-hour countdown by writing
     a Due field.

  3. A scheduled automation runs hourly, finds Deliverables past their Due field still
     in "Ready for Review", and posts an escalation to a #chasing channel.

  4. When a Freelancer record is linked to a Shoot, an automation sends them a booking
     confirmation email through a Gmail action and writes the rate into a Costs field
     by looking up their day rate.

  Problems we've hit:

  The script in automation 1 hits Airtable's execution time limit on larger packages.
  When it does, it has already created some Deliverables but not all, and there is no
  indication which - we find out when a producer notices a missing deliverable weeks
  later.

  Automation 3 posts the same escalation every hour until someone acts. Producers
  have muted the channel.

  Automation 4 reads the day rate at the moment of linking. If we renegotiate a
  freelancer's rate afterwards, historical Costs are correct but anything booked in
  advance silently carries the old rate. Finance found a £4,000 discrepancy in Q2.

  We're also close to the automation run limit on our plan and nobody knows which
  automation is consuming it.

