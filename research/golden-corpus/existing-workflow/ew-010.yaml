case_id: ew-010
input_type: existing_workflow

content: |
  Could someone look over our commission calculation script? It's Google Apps Script
  bound to a Sheet and it decides what our sales team gets paid, which is why I'd like
  another pair of eyes.

  What it does, in order:

  onOpen() adds a custom menu with "Run Commission".

  runCommission() does the following:
  - reads the "Closed Deals" sheet, which is populated by a Zapier Zap from HubSpot
    whenever a deal moves to Closed Won
  - for each row, looks up the rep in a "Rates" sheet to get their tier percentage
  - applies an accelerator if the rep is over quota, which it works out by summing
    their closed deals for the quarter from the same sheet
  - writes the calculated commission into a "Commission Run" sheet with a timestamp
  - sends a summary email to finance using MailApp

  Volume is about 180 deals a quarter across 14 reps.

  What concerns me:

  It's run manually by whoever remembers, usually our sales ops person. If she's on
  leave it doesn't happen until someone notices.

  There's no guard against running it twice. We did once, in January, and finance
  paid two reps twice before catching it. The Commission Run sheet just got a second
  set of rows with a later timestamp.

  The quota accelerator reads the same "Closed Deals" sheet it's iterating over. If
  the Zap adds a row mid-run, some reps are evaluated against a different total than
  others. I don't know whether that's actually happened but it worries me.

  Rates are edited directly in the Sheet by two people. There's no history of what a
  rate was when a commission was calculated.

  We're not looking to move off Sheets - it's what finance wants to work in.

