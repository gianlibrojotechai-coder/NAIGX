case_character: central
special_class: null

rationale: |
  Materially different by execution model and by consequence class. The other
  workflow-path cases move data between systems; this one **computes money**. Google
  Apps Script bound to a Sheet is a distinct and very common automation form in this
  market - `jd-006` names it explicitly as something an agency encounters - and it has
  failure modes the iPaaS cases do not: manual invocation, no run history, and a
  spreadsheet as both input and mutable configuration.

  Expected substance. `FR-021` requires issues specific to the submitted workflow with
  severity and concrete remediation. Four diagnosable defects, all evidenced:

  - **No idempotency guard**, with a realised double payment in January. The mechanism
    is stated precisely - a second set of rows with a later timestamp - so this is
    diagnosable rather than speculative.
  - **Manual invocation with a single point of dependence.** A payroll-adjacent process
    that runs when someone remembers is an availability defect regardless of the code.
  - **Read-during-write hazard.** The accelerator sums the same sheet being iterated
    while a Zap may append to it. This is the most technically interesting finding.
  - **Unversioned rates.** Two people edit rates directly with no history, so a past
    commission cannot be reconstructed or defended.

  The unversioned-rate finding is the one most likely to be under-weighted. Nothing has
  visibly failed because of it, but it means the business cannot answer "why was this
  rep paid that" - which for commission is the question that eventually gets asked.

  `FR-044` and rubric criterion C-5 (Honest) apply sharply to the third defect. The
  submitter is explicit: "I don't know whether that's actually happened but it worries
  me." A response asserting that reps have been mis-evaluated has invented a fact; a
  response that dismisses it because no incident is reported has understated a real
  hazard. The correct handling is to confirm the hazard is real, state that occurrence
  is unevidenced, and say what would establish it.

  The stated constraint - staying on Sheets because finance wants to work there -
  bounds `platform_comparison`, which remains on the path per `AI §9.1`. A response
  recommending migration off Sheets has ignored a stated constraint (rubric criterion
  C-1, Grounded).

  Confidence `high`. CF-1 is strong: function-level description, named sheets, trigger
  mechanism, volumes, headcount, and a dated incident with its mechanism. CF-4 is
  strong: 180 deals, 14 reps, quarterly. CF-7 is a mild downward pressure - one concern
  is unverified - but it is not material to the analysis as a whole, since three of the
  four defects are independently evidenced. No capping condition applies (`AI §8.3`).

