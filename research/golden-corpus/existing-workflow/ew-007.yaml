case_character: central
special_class: null

rationale: |
  Materially different from every other workflow-path case: this is not an automation
  platform at all. `ew-002` (n8n), `ew-003` (Zapier), `ew-005` (Make) and `ew-006`
  (Power Automate) are all vendor tools with run histories and error surfaces. This is
  cron, bash, and a stored procedure. A corpus that only contains iPaaS workflows would
  encode an assumption that `FR-021` review means reading a vendor's node graph, and
  a great deal of real integration in this market looks like this.

  Expected substance. `FR-021` requires issues specific to the submitted workflow.
  Five diagnosable defects, all evidenced:

  - **Silent partial success.** A missing dealer file produces "unchanged" rather than
    an error, so absence of data is indistinguishable from no change. This is the most
    consequential finding and is the mechanism behind the six-week incident.
  - **A success signal that cannot fail.** The "sync complete" email sent throughout the
    six weeks. As in `ew-002`, the detection control existed and did not function -
    but here it is worse, because the email is unconditional by construction.
  - **Sequential fan-in** across 34 endpoints, with runtime growth from 20 minutes to
    three hours and a collision with the 06:00 extract.
  - **End-of-life runtime and OS**, with patching deferred two years - a security and
    operability finding rather than a logic defect.
  - **Truncate-then-load staging** with no evident guard if the load fails partway.

  The submitter's actual question is unusual and must be answered as asked: what does
  the current system *guarantee*? That is a request to characterise behaviour, including
  behaviour they may be depending on unknowingly - not a request for improvements.
  `FR-021` requires issues specific to the submitted workflow, and a response that
  supplies a modernisation plan instead of an honest account of current guarantees has
  answered a question that was explicitly not asked.

  `platform_comparison` remains on the path per `AI §9.1`. No platform constraint is
  stated here, unlike `ew-005` and `ew-006`, so the comparison is genuinely open.

  Confidence `high`. CF-1 is strong: command-level structure, endpoint count, runtime
  versions, schedule, observed runtime growth, and a quantified incident. CF-4 is
  strong: 34 endpoints, 01:15, Python 2.7, CentOS 7, six weeks, 20 minutes to three
  hours, 06:00. No capping condition applies (`AI §8.3`).

