case_id: ew-007
input_type: existing_workflow

content: |
  We have a nightly job that syncs our dealer network's stock positions and I'd like
  someone to look at it properly. It predates everyone currently here.

  It's a bash script on a Linux VM, run by cron at 01:15. Roughly what it does:

  - curl to pull a CSV from each of 34 dealer SFTP endpoints, in a for loop, sequential
  - a Python script (Python 2.7) that concatenates them, deduplicates on part number,
    and writes a combined CSV
  - psql to truncate a staging table and COPY the combined file in
  - a stored procedure that merges staging into the live stock table
  - mailx to send a one-line "sync complete" to an internal distribution list

  Things we know:

  The Python 2.7 dependency is why nobody has touched the VM. It's on CentOS 7, also
  end of life. Any OS patching has been deferred for two years because we're afraid of
  breaking it.

  If a dealer's SFTP is down, curl fails, that dealer's file is missing, and the
  concatenation just proceeds with 33 files. The merge then treats that dealer's
  entire stock as unchanged - not zero, unchanged - so the live table keeps yesterday's
  numbers indefinitely. We found one dealer whose stock hadn't updated for six weeks.

  The "sync complete" email sends whether or not anything worked. It's been sending
  successfully every night for four years, including the six weeks above.

  Runtime has grown from about 20 minutes to just under three hours as dealers were
  added. It now sometimes overlaps the 06:00 reporting extract.

  We're not asking whether to rebuild it - we know we need to. We want to understand
  what it actually guarantees today so we don't lose a behaviour we didn't know we
  depended on.

