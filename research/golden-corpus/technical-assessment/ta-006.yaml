rationale: |
  Materially different from the other assessment cases by problem class. `ta-001` is
  multi-source ingestion, `ta-002` a constrained legacy estate, `ta-003` usage billing
  with late arrivals, `ta-004` a design critique, `ta-005` a single-pattern question.
  This is **dual-run migration**, where the defining property is that two systems are
  simultaneously authoritative for different parts of the same dataset and must be
  reconciled while both are moving.

  Expected substance. `FR-023` requires a solution architecture with explicit trade-off
  reasoning, a diagram, and at least one rejected alternative. The brief asks for the
  rejected alternative directly, so that criterion is cleanly testable.

  Four genuine tensions any defensible answer must engage, all stated:
  - Split authority during transition, with inter-site stock movement crossing the
    boundary daily. This is the core difficulty and cannot be designed around.
  - A nightly consolidated position spanning both systems while the split is live.
  - An undocumented legacy schema with no vendor and no author.
  - A 5,000 requests/hour rate limit against 12,000 daily movements — which is the
    kind of arithmetic a shallow answer skips. The limit is not obviously binding, and
    working out whether it is, is part of the exercise.

  Deliverable 4 is the most valuable and the easiest to answer badly: how would you
  know the two systems disagree. That is a request for a reconciliation and detection
  design, not a data-flow diagram, and a response that describes only the happy path
  has not answered it.

  Deliverable 6 — what would make you recommend delaying — pairs with the closing line
  about a problem "where being partially wrong is normal". Together they invite the
  candidate to state conditions under which the plan should not proceed, which maps
  onto `FR-044` unknowns disclosure and rubric criterion C-5 (Honest). A response that
  cannot name a delay condition has misjudged the brief.

  Confidence `high`. CF-1 is strong: site count, SKU count, daily movement volume,
  transition duration, both systems' interfaces, the rate limit, and stated permitted
  assumptions. CF-4 is strong: 6, 90,000, 12,000, eight weeks, 14 years, 5,000/hour.
  No capping condition applies (`AI §8.3`) — the constraints are difficult but
  consistent, and the undocumented schema is a stated condition the brief asks the
  candidate to address rather than an unknown blocking analysis.

