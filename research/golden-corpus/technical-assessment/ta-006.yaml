case_id: ta-006
input_type: technical_assessment

content: |
  Architecture Exercise - Data Migration and Cutover

  Please spend no more than four hours. A written design is what we're after.

  The situation

  A logistics client is replacing their warehouse management system. The old system
  (in-house, SQL Server, 14 years old) and the new one (a SaaS WMS with a REST API)
  must both operate during a transition period of roughly eight weeks, because the
  client will not accept a big-bang cutover across their six sites.

  During transition, sites move over one at a time. A site that has moved uses the new
  system. Sites that have not still use the old one. But stock is transferred between
  sites daily, and the finance team needs a single consolidated inventory position
  every night regardless of which system a site is on.

  Some numbers: 6 sites, about 90,000 SKUs, roughly 12,000 stock movements a day
  across the estate. The old system's database can be read directly but the vendor who
  built it is gone and there is no documentation. The new system's API is documented
  and rate-limited at 5,000 requests per hour.

  What we'd like

  1. How you would keep both systems coherent during the eight weeks.
  2. How the nightly consolidated position is produced.
  3. What you would do about the undocumented legacy schema.
  4. How you would know, during transition, that the two systems disagree - and what
     you would do when they do.
  5. One approach you considered and rejected, with your reasoning.
  6. What would make you recommend delaying the cutover.

  Assume you have the client's cooperation and a reasonable budget. We are interested
  in how you reason about a problem where being partially wrong is normal.

