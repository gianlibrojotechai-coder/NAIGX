rationale: |
  Fourth and final `minimal` case, completing that character for
  `technical_assessment`. With `br-004` (66), `ew-004` (81) and `jd-004` (83), all four
  analysable paths now have a case near the `FR-002` floor, which is what makes
  proportionality (`FR-017`, `AC-037`) testable per path rather than only in aggregate.

  Why the reduction stops where it does. `mermaid_diagram` is retained where the other
  minimal cases dropped their diagram, because the input explicitly requests one -
  "diagram plus notes". Omitting it on proportionality grounds would ignore a stated
  instruction, which no proportionality rule licenses. `architecture_recommendation` is
  retained because a design is what was asked for. `assessment_feedback` is dropped
  because its own acceptance criteria cannot be met from this input.

  That last point is the interesting one. `FR-023` requires a named rejected
  alternative and stated trade-offs, but the choice between idempotency strategies
  turns entirely on facts this input does not supply - volume, whether the source
  guarantees at-least-once delivery, whether duplicates arrive within seconds or days,
  and what consistency the downstream requires. Naming a rejected alternative here
  would mean inventing the grounds for rejecting it, which is precisely what rubric
  criterion C-5 (Honest) and `FR-044` prohibit.

  Expected substance. The correct response almost certainly states its assumptions
  explicitly and surfaces the unknowns that would change the design (`FR-044`). A
  confident single design presented without them would be the failure mode - and it is
  a likely one, because "idempotent webhook receiver" is a well-known problem with
  well-known textbook answers. The temptation is to answer from the pattern rather than
  from the input, which is exactly what rubric criterion C-1 (Grounded) catches.

  Confidence `low`. CF-1 is very low: no volume, no source system, no delivery
  semantics, no consistency requirement, no latency budget. CF-4 is absent - no
  concrete value appears anywhere. Under `AI §8.4` absence lowers and never raises.
  No capping condition applies (`AI §8.3`); `low` is base confidence.

  ⚠️ Ambiguity A-12 applies to the `assessment_feedback` omission. It rests on the
  artifact's own acceptance criteria being unmeetable rather than on structural
  impossibility, which is the same weaker footing as `br-004` and `jd-004`.

