case_id: ta-007
input_type: technical_assessment

content: |
  Take-home: designing an integration that handles personal data

  Time guidance: three hours. Written design and a diagram. No code.

  Brief

  A recruitment business wants candidate data to flow from their applicant tracking
  system (Greenhouse) into three places: a background-check provider, a payroll system
  for successful hires, and an internal analytics warehouse used for diversity
  reporting.

  Each destination needs a different subset of the data.

  The background-check provider needs identity details - full name, date of birth,
  address history, right-to-work documentation. It does not need salary, interview
  notes, or anything about other candidates.

  Payroll needs identity plus bank details and salary, but only for candidates who
  have accepted an offer. It must never receive data about candidates who did not.

  The analytics warehouse needs aggregate diversity reporting. It must not be able to
  identify individuals, and the business is clear that "we just won't query it that
  way" is not an acceptable control.

  Constraints. UK GDPR applies. The business has had one near-miss already, where a
  test integration sent live candidate records to a sandbox environment that
  contractors could access. That is why they are being careful this time.

  Please cover

  1. Your design, including how data reaches each destination.
  2. How each destination is prevented from receiving data it should not have -
     structurally, not by convention.
  3. How the analytics requirement is met without individual identification.
  4. What you would log, and what you would deliberately not log.
  5. An approach you rejected and why.

  We are evaluating how you reason about a design where the failure mode is disclosure
  rather than downtime.

