rationale: |
  Materially different from the other assessment cases by **failure mode**. `ta-001`,
  `ta-002`, `ta-003` and `ta-006` all concern correctness or availability — data
  arriving wrong, late, or not at all. Here the brief states the axis explicitly: "the
  failure mode is disclosure rather than downtime". Nothing else in the corpus tests
  reasoning about data minimisation and access boundaries, and it is a routine concern
  in the market this product serves — `br-006` and `jd-008` both carry regulatory data
  constraints from the requirement and hiring sides.

  Expected substance. `FR-023` requires trade-off reasoning, a diagram, and a named
  rejected alternative, which deliverable 5 requests directly.

  Three requirements make this genuinely hard and are all stated:
  - **Structural rather than conventional control.** Deliverable 2 asks how each
    destination is *prevented* from receiving what it should not, "structurally, not by
    convention". A design that routes correctly but could route incorrectly has not
    answered the question — the distinction between "does not" and "cannot" is the
    exercise.
  - **The analytics requirement forecloses the easy answer.** The business explicitly
    rejects "we just won't query it that way", so access-control-only designs fail.
    This is the sharpest test: it demands reasoning about what leaves the boundary
    rather than who reads it afterwards.
  - **Conditional data flow.** Payroll must receive accepted candidates only and must
    never see the rest, which is a state-dependent authorisation, not a static
    subsetting rule.

  Deliverable 4 — what you would log and deliberately not log — is the one most likely
  to be answered thinly. It connects directly to the stated near-miss and to the same
  discipline `jd-008` names as a hiring requirement. A response that treats logging as
  an afterthought has missed that observability is where minimisation designs usually
  leak.

  Confidence `high`. CF-1 is strong: named source system, three destinations with their
  precise data requirements, a stated regulatory regime, a described prior incident,
  and explicit evaluation criteria. CF-2 is strong — the constraints are stated,
  including the one the business pre-emptively rules out. No capping condition applies
  (`AI §8.3`).

