rationale: |
  Classification. The document assesses a candidate rather than requesting work for
  the submitter's own business. Every surface and substantive signal agrees.

  Artifact set. `FR-023` requires a solution architecture with explicit trade-off
  reasoning and a diagram. `AI §9.1` maps the assessment path to exactly
  `architecture_recommendation`, `mermaid_diagram` and `assessment_feedback`.

  Expected substance. `FR-023` requires at least one rejected alternative named with
  its reason - which this brief also asks for directly, making it a clean test of
  that acceptance criterion. Output must be structured for the candidate to
  understand and defend, not to submit verbatim (`FR-023`).

  The brief contains three genuine design tensions worth surfacing: mixed push and
  poll delivery, change detection against an API with no change endpoint, and
  idempotency against a downstream system that dedupes on external order ID. A
  response that does not engage with all three is generic (rubric criterion C-2).

  Confidence `high`. CF-1 and CF-4 are strong: three named systems, a stated rate
  limit, a stated polling cadence, an explicit failure scenario, and stated
  permitted assumptions. No capping condition applies (`AI §8.3`).

  This is the assessment-path counterpart to `br-001` - the baseline against which
  the other assessment cases are read.

