case_id: ta-001
input_type: technical_assessment

content: |
  Technical Assessment - Integration Engineer

  Estimated time: 3-4 hours. Please submit a written design; no code is required.

  Scenario

  Our company receives order events from three e-commerce channels: our own Shopify
  store, an Amazon Seller Central account, and a wholesale portal that exposes a
  REST API with a 60-requests-per-minute rate limit.

  Each channel represents the same underlying concept - an order - with different
  field names, different currency handling, and different timing. Shopify pushes
  webhooks in near real time. Amazon reports are available on a 15-minute polling
  cycle. The wholesale portal must be polled and has no change-detection endpoint,
  so you must work out which orders are new.

  Orders must land in our warehouse management system, which accepts a single
  normalised order format over HTTP and rejects duplicates by external order ID.

  Please describe

  1. Your proposed design, including how data moves between the systems.
  2. How you would handle the differing delivery mechanisms.
  3. What happens when the warehouse system is unavailable for 30 minutes.
  4. At least one alternative approach you considered and why you rejected it.
  5. Any assumptions you are making.

  You may assume credentials are available and that infrastructure cost is not a
  constraint. We are more interested in your reasoning than in completeness.

