case_id: ta-003
input_type: technical_assessment

content: |
  Here's the problem we'd like you to work through before we speak again.

  A subscription business sends usage-based invoices monthly. Usage is metered by an
  internal service that emits one event per API call - about 12 million events a
  month across 4,000 customers. Billing runs on the 1st of each month and must
  produce a single invoice per customer in Stripe, priced according to a tiered
  rate card that changes at most twice a year.

  Two things make this harder than it looks. Events can arrive up to 72 hours late
  because some customers run batched integrations. And a small number of customers
  have negotiated custom rate cards that override the standard tiers.

  Sketch out how you would approach this. We're interested in where you'd put the
  boundaries, how you'd handle the late-arriving events, and what you'd do about the
  custom rate cards without special-casing them into the billing logic.

  You can assume the metering service and Stripe are both reliable and that you have
  whatever infrastructure you need. Don't worry about writing code - a diagram and
  some notes are fine. We'll talk through your reasoning on the call and we're as
  interested in the options you discarded as the one you chose.

