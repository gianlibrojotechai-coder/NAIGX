case_character: near-boundary
special_class: null

rationale: |
  Why near-boundary rather than ambiguous. The distinction established by `ew-001`
  and `jd-001` applies. Near-boundary means competing *surface* signals with decisive
  substance; ambiguous means genuinely competing substance. Here the informal,
  untitled framing is surface, while the conversational evaluation markers are
  substantive and one-directional. Nobody asks a vendor what options they discarded
  before a call in order to procure a system - they ask that to assess someone.

  Contrast with `jd-001`, where a complete automation requirement genuinely competes
  with a complete job posting inside one document. There is no such competition here.

  Artifact set. Assessment path per `AI §9.1`, unchanged.

  Expected substance. `FR-023` requires a named rejected alternative, which the brief
  requests directly. The two stated complications - 72-hour late arrival and
  contract-specific rate cards - are the substance any defensible answer must engage,
  and the brief's explicit constraint against "special-casing them into the billing
  logic" is a design instruction rather than a preference.

  Confidence `medium`. CF-1 is moderate. Volumes and cadence are concrete (12 million
  events, 4,000 customers, monthly on the 1st, 72-hour lateness), but the tiered rate
  card structure is referenced without being specified, and "a small number" of custom
  rate cards is unquantified - both material to a billing design. CF-4 is therefore
  mixed. No capping condition applies (`AI §8.3`); this is a base-confidence judgement
  reflecting genuinely partial evidence, not a cap.

