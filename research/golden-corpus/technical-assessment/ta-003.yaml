expected_classification_confidence:
  bound: at_or_above_threshold
  threshold: 0.6
  rationale: >
    Near-boundary, not ambiguous. The document carries no assessment title, no stated
    duration, and no numbered deliverables - surface features that make it read like
    a business requirement. The substance is nonetheless decisive: "before we speak
    again", "we'll talk through your reasoning on the call", permission to assume
    infrastructure away, an explicit instruction not to write code, and interest in
    "the options you discarded". Those are evaluation signals, not procurement
    signals. A correct classifier should reach `technical_assessment` without needing
    `FR-015` confirmation. If a future run falls below threshold here, that is a
    classifier weakness this case exists to expose, not an expectation to relax.

expected_complexity:
  status: not_applicable
  reason: >
    `complexity_score` is not applicable to the assessment path (`AI §9.1`) and is
    omitted for this case.

expected_risk:
