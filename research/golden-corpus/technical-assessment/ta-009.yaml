case_id: ta-009
input_type: technical_assessment

content: |
  Interview question we'd like you to think about beforehand.

  A client's automation currently polls a supplier's REST API every five minutes for
  new orders. The supplier has just offered to send webhooks instead. Order volume is
  around 300 a day, arriving unevenly - most between 9am and 11am.

  Would you switch to webhooks, stay on polling, or do both? We want your reasoning
  and what would change your answer, not a design. Five minutes of discussion, not a
  written submission.

