case_character: central
special_class: null

rationale: |
  Materially different by problem class: **multi-tenancy and the isolation/leverage
  trade-off**. Nothing else in the corpus tests reasoning about serving many clients
  from shared machinery, and it is a defining problem for the agency segment the
  research corpus identifies (`JD-003` and `JD-005` in the job-description matrix both
  describe agencies maintaining per-client integrations).

  Recorded as `central` rather than `near-boundary` on the character axis, while its
  classification-confidence rationale documents a near-boundary pull. Those are
  different fields answering different questions: `case_character` records what the
  case is for, and this case exists to test a problem class, not a classification edge.
  `technical_assessment` already has two near-boundary cases (`ta-003`, `ta-008`).

  Expected substance. `FR-023` requires trade-off reasoning and a named rejected
  alternative. This brief is unusually well-suited to that because the submitter has
  already framed the trade-off honestly: consolidation buys leverage and costs blast
  radius. A response that recommends consolidation without pricing that cost has
  answered a question the submitter had already moved past.

  Three stated constraints must shape any defensible answer:
  - **Structural data separation is currently guaranteed and two clients have asked
    about it in writing.** That converts an architectural property into a commitment
    the agency has made. A design that reduces it to a configuration check has
    materially changed what those clients were told.
  - **Legitimate divergence exists** — different thresholds, one bespoke integration —
    with an explicit warning that configuration must not become a second codebase.
    This is the genuinely hard part, and glossing it is the most likely failure.
  - **Three clients are on unreconstructable versions.** Consolidation cannot proceed
    without deciding what happens to them, and a plan that assumes a clean starting
    point has ignored a stated fact.

  "What you would want to be true before starting" maps directly onto `FR-044` unknowns
  disclosure and is the deliverable most likely to be skipped.

  Confidence `medium`. CF-1 is moderate: client count, workflow count, onboarding
  effort, and the four concerns are stated, but the platform is unnamed, what the six
  workflows do is unspecified, and the nature of the bespoke integration is unstated —
  all material to how consolidation would actually work. CF-4 is mixed: concrete on
  counts, absent on the systems themselves. No capping condition applies (`AI §8.3`).

