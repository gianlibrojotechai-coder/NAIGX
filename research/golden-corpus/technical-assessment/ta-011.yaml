expected_classification_confidence:
  bound: at_or_above_threshold
  threshold: 0.6
  rationale: >
    Near-boundary against `existing_workflow`, and decided on substance. The surface
    pull is real: a running multi-client estate is described with a stated failure
    (divergent versions) and a stated cost (28-fold change effort).

    The substance is decisive and forward-looking. The request is to reason about a
    consolidation the submitter is considering but has not committed to — "before we
    commit, we want to think properly about what that costs us", "what you would want
    to be true before starting", "we will talk it through rather than review a
    document". Nobody is asking for the current workflows to be reviewed; they are
    asking someone to reason about a topology decision ahead of a discussion. That is
    evaluation, not diagnosis.

    Contrast `ta-008`, which is the same boundary approached from cost rather than
    structure, and `ew-003`, where the submitter genuinely had not decided between
    fixing and replacing and the correct behaviour was to ask.

