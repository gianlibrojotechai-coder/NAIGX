case_id: ta-011
input_type: technical_assessment

content: |
  Architecture discussion prep — please read before our session on Tuesday

  We are a small agency running automations on behalf of clients. Today each client
  gets their own workspace on the automation platform, their own connections, and
  their own copies of what are essentially the same six workflows. We have 28 clients.

  This worked at five clients. At 28 it does not. When we improve a workflow we have
  to apply the change 28 times, and in practice we apply it to the clients who
  complained and leave the rest. Three clients are now on versions we would struggle
  to reconstruct.

  We are considering consolidating onto shared workflows with per-client configuration
  instead. Before we commit, we want to think properly about what that costs us.

  The things that worry us:

  Blast radius. Today a bad change breaks one client. Shared workflows mean a bad
  change could break 28.

  Client data separation. Our clients are competitors in some cases. Two have asked
  in writing whether their data can reach another client's workspace. Today the answer
  is structurally no. We would want that to stay true.

  Divergence that is legitimate. Some clients genuinely need different behaviour —
  different approval thresholds, one has a bespoke integration nobody else uses. We
  do not want configuration to become a second codebase.

  Onboarding. A new client currently takes about two days of setup. We would like that
  shorter, but not at the cost of the above.

  Bring your thinking on how you would approach the consolidation, what you would keep
  separate, and what you would want to be true before starting. We will talk it
  through rather than review a document.

