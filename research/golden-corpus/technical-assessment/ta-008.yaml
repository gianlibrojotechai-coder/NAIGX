rationale: |
  Fifth near-boundary case, testing an axis none of the others do: an informal
  assessment about an **existing production system**. `ta-003` was informal framing
  against evaluation substance with a greenfield problem; this adds a real running
  pipeline, which pulls much harder toward `FR-021`.

  It is also the only case in the corpus where the driving constraint is **cost** rather
  than correctness, latency, or disclosure. That matters: `docs/09` §1 scores complexity
  and `FR-032` handles risk, but neither addresses unit economics, and a market that
  automates document processing meets this constraint constantly.

  Expected substance. `FR-023` requires trade-off reasoning and at least one rejected
  alternative — and the brief asks for the second directly, in an unusual form: "what
  you'd refuse to change". That inverts the normal request and is the sharpest test
  here, because the obvious cost reductions all trade against the one thing declared
  non-negotiable.

  Three tensions any defensible answer must engage, all stated:
  - Per-page pricing against nine-page documents where line items sit on pages two and
    three. Page selection is the obvious lever and it directly risks accuracy — which
    is precisely the trade the brief wants reasoned about, not assumed away.
  - Full reprocessing on reviewer correction, acknowledged as a build-time shortcut.
  - A stated target of £30,000 against a £71,000 run rate. The arithmetic constrains
    which levers are sufficient, and a response that proposes savings without checking
    them against the target has not answered the question.

  The accuracy constraint is `stated` and absolute — "a missed invoice line becomes a
  payment dispute". A response that reduces cost by accepting lower extraction accuracy
  has failed rubric criterion C-1 (Grounded) regardless of how well-argued it is.

  Confidence `medium`. CF-1 is moderate: volumes, annual cost, page counts, target and
  the accuracy constraint are stated, but the OCR vendor is unnamed, per-page pricing is
  not given, the match failure rate is absent, and review-queue volume is unknown —
  all material to sizing any proposed saving. CF-4 is mixed: strong on totals, absent on
  the unit economics the question turns on. No capping condition applies (`AI §8.3`);
  this is base confidence reflecting genuinely partial evidence.

provenance:
  origin: synthetic
  notes: >
    Authored for the corpus. Deliberately a cost-constrained brief about a running
    system, testing both the assessment/workflow boundary and an economic constraint
    the other cases do not carry. No real client or pipeline is described.

