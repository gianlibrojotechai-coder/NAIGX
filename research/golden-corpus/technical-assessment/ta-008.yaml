case_id: ta-008
input_type: technical_assessment

content: |
  Something for you to look at ahead of Thursday.

  We run a document processing pipeline for a client. Scanned supplier invoices arrive
  by email, an OCR service extracts line items, a matching step reconciles them against
  purchase orders in the client's ERP, and anything that doesn't match cleanly goes to
  a review queue.

  It works. The problem is what it costs. We're processing about 240,000 documents a
  year and the run rate has reached roughly £71,000 annually, which is more than the
  client is saving. The OCR service is the bulk of it - it's priced per page and we
  send every page of every document. Documents average nine pages but the line items
  are almost always on pages two and three.

  We also re-process the whole document when a match fails and a reviewer corrects
  something, because that was simpler to build than partial reprocessing.

  The client has asked us to get this under £30,000 without reducing accuracy. They've
  been clear that accuracy is not negotiable - a missed invoice line becomes a payment
  dispute.

  Have a think about where you'd take the cost out and what you'd be trading away.
  We're as interested in what you'd refuse to change as what you would. Bring it
  Thursday and we'll talk it through - nothing written needed.

