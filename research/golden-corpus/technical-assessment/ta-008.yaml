expected_classification_confidence:
  bound: at_or_above_threshold
  threshold: 0.6
  rationale: >
    Near-boundary, and the competing type is `existing_workflow` — an axis no other
    assessment case tests. The surface pull is strong: a running production pipeline is
    described step by step, with a stated defect (cost) and known causes.

    The substance is decisive. Every marker is evaluative rather than diagnostic:
    "something for you to look at ahead of Thursday", "have a think about", "we're as
    interested in what you'd refuse to change", "bring it Thursday and we'll talk it
    through", "nothing written needed". The submitter already knows where the cost is —
    per-page pricing on nine-page documents — so they are not asking for diagnosis.
    They are assessing how the reader reasons about a trade-off.

    Contrast `ew-008`, where a running system is described and the submitter genuinely
    wants it fixed. Here nobody is asking for a fix; they are asking what the reader
    would do, before a conversation.

