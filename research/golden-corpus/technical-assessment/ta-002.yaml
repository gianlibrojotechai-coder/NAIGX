case_id: ta-002
input_type: technical_assessment

content: |
  Platform Engineering Exercise - Automation Team

  Please read the whole brief before starting. We expect this to take four to six
  hours. Submit a design document; working code is explicitly not required and will
  not earn extra credit.

  Background

  You are joining a team that runs automation for a mid-sized insurance broker. The
  broker has 180 staff across four offices and handles roughly 40,000 policy events
  per year - new business, renewals, mid-term adjustments, and cancellations.

  The current estate

  Policy data lives in a legacy system called Acturis, accessible only through a
  SOAP API with a published WSDL. It is stable but slow: a single policy read
  averages 1.2 seconds and the vendor enforces a hard cap of 10 concurrent
  connections across the whole company.

  Customer communications go out through a marketing platform that exposes a modern
  REST API with generous limits. Documents are stored in SharePoint Online.
  Finance reconciliation happens in a nightly batch that reads a CSV drop from
  Acturis and loads it into Power BI.

  There is an existing set of 30 or so Power Automate flows built over three years
  by various people. Roughly a third are known to be broken or disabled. Nobody has
  a complete inventory. There is no test environment for Acturis.

  The problem

  When a policy is amended mid-term, four things must happen: the customer receives
  an updated schedule document, the marketing platform's segmentation is refreshed,
  the finance reconciliation must pick up the premium change, and if the amendment
  reduces cover below a regulatory minimum a compliance alert must be raised within
  one working day.

  Today this is partly manual. Amendments are processed in Acturis, and an
  administrator then triggers the document generation by hand and emails compliance
  if they notice a cover reduction. Two compliance breaches in the last year were
  traced to amendments nobody flagged.

  What we would like from you

  1. A target design for handling mid-term amendments end to end.
  2. How you would work within the Acturis concurrency and latency constraints.
  3. Your approach to the existing undocumented Power Automate estate - specifically
     whether you would migrate, replace, or leave it, and why.
  4. How you would make the compliance alerting reliable enough to depend on, given
     that a missed alert is a regulatory matter rather than an inconvenience.
  5. At least one approach you considered and rejected, with your reasoning.
  6. What you would need to know before committing to this design, and how you would
     find it out.

  Evaluation

  We are assessing your reasoning, your handling of constraints you cannot remove,
  and your judgement about what to leave alone. A design that ignores the Acturis
  limits or assumes the legacy estate away will not score well. We would rather see
  a smaller design you can defend than a comprehensive one you cannot.

