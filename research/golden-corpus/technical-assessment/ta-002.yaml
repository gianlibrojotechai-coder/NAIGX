rationale: |
  Why substantial. `docs/11` §2.2 requires long, detailed input that exercises depth
  without over-production. This brief carries hard constraints (10 concurrent
  connections, 1.2s per read), an undocumented legacy estate, a regulatory deadline,
  and an explicit instruction preferring a smaller defensible design over a
  comprehensive one. It tests whether depth scales with input without the response
  sprawling - the counterpart to `br-004`, which tests the same proportionality rule
  from the minimal end.

  Classification. Unambiguously an assessment despite substantial operational detail.
  Deliverable 3 asks what the candidate would leave alone, which no real requirement
  submitter would ask of a vendor.

  Artifact set. Identical to `ta-001` - `AI §9.1` scopes the assessment path to three
  artifacts regardless of input length. Length changes depth, not membership, which
  is the proportionality distinction `AC-037` tests.

  Expected substance. `FR-023` requires at least one rejected alternative and stated
  trade-offs. The brief supplies three constraints that must shape any defensible
  answer: Acturis concurrency, the absence of a test environment, and the regulatory
  consequence of a missed compliance alert. Deliverable 6 asks what the candidate
  would need to know - which maps directly onto `FR-044` unknowns disclosure, making
  this case a test of whether unknowns are surfaced with what would resolve them
  rather than filled with plausible defaults.

  Confidence `high`. CF-1 and CF-4 are strong throughout: staff count, event volume,
  concurrency cap, read latency, estate size and breach history are all concrete.
  No capping condition applies (`AI §8.3`) - the constraints are difficult but not
  contradictory, and the unknowns the brief names are ones it asks the candidate to
  identify rather than ones blocking the analysis.

