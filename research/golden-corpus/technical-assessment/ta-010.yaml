rationale: |
  Materially different from the other assessment cases by subject: this is an
  **observability** design rather than a data-movement one. `ta-001`, `ta-006` and
  `ta-007` design pipelines; this designs the means of knowing whether pipelines work.

  The case is notable for a second reason worth recording plainly. The problem it poses
  — silent failure across a heterogeneous automation estate — is the same problem the
  NAIGX research corpus identifies as the market's most frequent, and the same one this
  product's own reliability thesis addresses. That does not make the expectations
  self-serving: the corpus records what a *correct analysis* looks like, not what NAIGX
  would build. But a reviewer should be alert to the risk of grading this case
  generously because its subject flatters the product.

  Expected substance. `FR-023` requires trade-off reasoning, a diagram, and a named
  rejected alternative, which deliverable 5 requests directly.

  Deliverable 2 is the difficult one and the reason the case exists: detecting runs
  that succeed while doing the wrong thing, where by definition nothing reports an
  error. Any serious answer has to move from run status to some assertion about
  outcomes — expected volumes, freshness, distributional checks — and a response that
  only aggregates run histories has answered deliverable 1 twice and deliverable 2 not
  at all. The corpus already contains three realised instances of this exact failure
  class (`ew-002` writing zeros, `ew-007` treating missing files as unchanged, `ew-009`
  partial record creation), which makes it a `C-7 Consistent` test as well.

  Deliverable 4 — what you would deliberately not monitor — pairs with the alert-fatigue
  problem the corpus has recorded twice (`ew-002`, `ew-009` muted channels). A design
  that alerts on everything has recreated the failure it was meant to fix, and `PV §3.2`
  treats over-production as a defect in exactly this spirit.

  The stated constraint that 120 automations cannot be modified in bulk is the binding
  one. It rules out instrumenting each automation and forces the design outward to
  platform run histories and external assertions. A response that assumes per-automation
  instrumentation has ignored a stated assumption (rubric criterion C-1, Grounded).

  Confidence `high`. CF-1 is strong: estate size, platform split, current logging
  positions, both failure patterns characterised, and explicit permitted assumptions.
  CF-4 is strong: 120 automations, 20 scenarios, a dozen jobs, three hours. No capping
  condition applies (`AI §8.3`).

