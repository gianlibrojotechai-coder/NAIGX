case_id: ta-010
input_type: technical_assessment

content: |
  Design Exercise — Knowing When Automation Has Failed

  Timebox: three hours. Written design and a diagram. We are not looking for code.

  Context

  You are joining a team that operates around 120 automations for internal business
  functions at a mid-sized insurer. They run across three platforms — a large Power
  Automate estate, about 20 scenarios in Make, and a dozen bespoke scheduled jobs on
  a VM.

  There is no common view of whether any of it is working. Each platform has its own
  run history. The bespoke jobs log to files on the VM. Failures are usually reported
  by the business, sometimes weeks after they start, and the team has no way of
  knowing how much is broken right now.

  Two failure patterns matter most to the business:

  A run that fails loudly. The platform records an error. Someone could see it if they
  were looking, and nobody is.

  A run that succeeds while doing the wrong thing — an integration returns an empty
  result set and the automation faithfully processes nothing, or writes a default
  value where real data should have been. These are the ones that surface weeks later
  and cost the most to unwind.

  What we would like

  1. How you would establish a single view of automation health across three
     heterogeneous platforms.
  2. How you would detect the second failure pattern, given that by definition nothing
     reports an error.
  3. What you would alert on, to whom, and how you would keep the signal usable over
     time.
  4. What you would deliberately not monitor, and why.
  5. One approach you considered and rejected, with your reasoning.

  Assume you can get read access to each platform's run history and that a modest
  budget for tooling exists. Assume you cannot modify the 120 automations in bulk.

