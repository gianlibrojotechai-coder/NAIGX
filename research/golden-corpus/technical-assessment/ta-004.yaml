expected_classification_confidence:
  bound: below_threshold
  threshold: 0.6
  rationale: >
    Genuinely ambiguous between `technical_assessment` and `business_requirement`, and
    both readings are substantively complete.

    As `technical_assessment`: a proposed design already exists, three specific
    uncertainties are named, and the closing question is "what would you do
    differently?" - a request to evaluate someone's reasoning, which is what the
    assessment path produces (`assessment_feedback`).

    As `business_requirement`: a client need is stated with volumes, named systems,
    and constraints. Nothing marks this as an examination - no time limit, no
    evaluation criteria, no candidate. The submitter is a practitioner doing real work,
    not a candidate being tested.

    The competition is real because the assessment path in `AI §9.1` does not require
    an examination context - it produces feedback on a solution architecture with
    trade-off reasoning, which is exactly what is being asked for. A correctly
    calibrated classifier should fall below the `FR-011` threshold and trigger
    `FR-015`.

