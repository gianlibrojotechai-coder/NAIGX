case_id: ta-004
input_type: technical_assessment

content: |
  We've been asked to put together a design for a client and I want a sanity check on
  our thinking before it goes out.

  The client is a veterinary group with 22 practices. They want appointment reminders
  and post-visit follow-ups automated. Currently each practice does its own thing -
  some use the reminder feature in their practice management system, some send texts
  manually, two do nothing.

  Their PMS is Provet Cloud, which has a REST API. They use Twilio for SMS at three
  practices already. Group head office wants consistency and reporting across all 22.

  Our proposed approach: a middleware layer that polls Provet Cloud per practice on a
  schedule, builds a reminder queue, sends via Twilio, and writes delivery status back
  as a note on the appointment record. Per-practice configuration for timing and
  message templates. A reporting database for group-level visibility.

  The bits we're unsure about: whether polling 22 practices is sensible versus asking
  the client to request webhook access, how to handle practices that opt out of parts
  of it, and whether the reporting database is over-engineering when the PMS might
  already expose enough.

  What would you do differently? We've got a week before this goes to the client.

