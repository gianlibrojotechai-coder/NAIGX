case_character: ambiguous
special_class: null

rationale: |
  Fourth ambiguous case, completing that character for `technical_assessment`. It
  tests an axis none of the others do: whether "assessment" requires an examination
  context, or whether any request to critique an existing design belongs on that path.

  Expected classification is `technical_assessment`. The test used throughout the
  corpus is what the submitter is asking for. They have a design and want it
  challenged - "what would you do differently" - which is the assessment path's
  output. Classifying this as `business_requirement` would produce a fresh design that
  ignores the thinking already done, which is the wrong answer to the question asked.

  This is the most contestable expectation in the corpus and is recorded as such. The
  consequence of the ambiguity is unusually visible: the two readings produce
  different artifact sets - `assessment_feedback` versus the full requirement set with
  `platform_comparison`, `risk_assessment` and `complexity_score`. That makes this the
  case where an `FR-015` confirmation is most valuable to the user, and where a silent
  wrong guess costs the most.

  Expected substance. `FR-023` requires at least one rejected alternative named with
  its reason and stated trade-offs. The three uncertainties the submitter names -
  polling versus webhooks, partial opt-out, and whether the reporting database is
  over-engineering - are the substance any useful response must engage. The third is
  the sharpest test: it invites the system to agree that a component should be
  removed, and `PV §3.2` treats over-production as a defect, so a response that
  validates the reporting database without examining whether the PMS already suffices
  has failed the question.

  Confidence `medium`. CF-1 is moderate: practice count, named systems, current state
  and the proposed design are all present, but no appointment volume, no reminder
  timing requirements, and no indication of what the PMS reporting already exposes -
  which is material to one of the three questions asked. CF-2 is weakened by the
  unresolved intent. No capping condition applies (`AI §8.3`).

