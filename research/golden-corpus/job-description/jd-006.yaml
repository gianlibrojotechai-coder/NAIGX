input_type: job_description

content: |
  Automation Consultant (client-facing)
  Manchester or remote · £48,000 - £58,000 + bonus

  We're a 25-person consultancy. We build automation for mid-market clients - mostly
  professional services, some logistics, occasionally manufacturing. Engagements run
  from a two-week discovery to nine-month builds.

  This is not an internal role. You'd be in front of clients from week one.

  A typical month

  You might spend a week mapping a claims process with an insurance broker's ops team,
  a week building in Make or n8n, a few days writing up a discovery for a prospect,
  and a day helping a colleague debug something in a client's Power Automate estate.
  You'd usually have two or three engagements live at once.

  We work in whatever the client already has. Last year that was Make, n8n, Zapier,
  Power Automate, one Workato tenant we inherited, and a surprising amount of Google
  Apps Script. We don't have a house platform and we don't sell one.

  What we need

  - You can build. Three-plus years hands-on with at least two automation platforms,
    and enough API and scripting ability to handle what platforms can't
  - You can discover. Sitting with someone who does a job and working out what actually
    happens, as opposed to what the process document says
  - You can say no. A meaningful share of what clients ask for shouldn't be built, and
    we'd rather you tell them that in week one than in month four
  - You can write. Our deliverables are documents. If a client can't follow your
    reasoning, the engagement hasn't landed

  Nice to have: exposure to regulated industries, or a background in operations rather
  than IT.

  We won't ask you to sell, but we will ask you to spot the next problem worth solving
  while you're in there.

