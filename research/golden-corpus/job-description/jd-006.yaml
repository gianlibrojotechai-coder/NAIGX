rationale: |
  Materially different from the other postings by employment context. `jd-002` is an
  in-house practitioner role at a single company on a fixed stack, `jd-005` is a senior
  in-house leadership role, `jd-003` a contract role at one client, `jd-004` a terse
  freelance advert. This is consultancy: many clients, no house platform, and
  deliberate breadth over depth.

  Why that changes the expected output. `FR-022` requires portfolio recommendations
  that are "specific and buildable" and interview guidance addressing "the
  architectural competencies the posting implies". For an in-house role those follow
  from the named stack. Here the stack is explicitly plural and inherited - "we work in
  whatever the client already has" - so a skill gap analysis that returns a tool list
  has missed the posting's actual claim, which is that platform-agnostic capability is
  the requirement. This is the corpus's test of whether extraction follows the
  posting's own logic rather than pattern-matching on product names.

  Three requirements are stated but non-technical, and are the substance of the role:
  discovery ("what actually happens, as opposed to what the process document says"),
  refusal ("a meaningful share of what clients ask for shouldn't be built"), and
  written communication ("our deliverables are documents"). All three must be labelled
  `stated` under `FR-013`. The refusal requirement is notable because it mirrors
  `PV §3.2` - the employer is hiring for the same judgement the product claims to
  exercise.

  Confidence `high`. CF-1 is strong: company size, client sectors, engagement lengths,
  concurrency, named platforms, salary band, and an explicit requirement list. CF-2 is
  strong - the requirements are stated with their reasoning attached. CF-4 is strong:
  25 people, £48,000-£58,000, three-plus years, two or three concurrent engagements.
  No capping condition applies (`AI §8.3`).

