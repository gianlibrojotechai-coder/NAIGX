rationale: |
  Materially different from every other posting by **function**. All seven others hire
  someone to build or own automation for their own organisation or its clients. This
  hires someone to sell an automation platform. It is a genuinely common role in this
  market and it inverts several assumptions the other cases share.

  Why that matters for `FR-022`. Two stated facts change what a correct skill gap
  analysis looks like:
  - **The output is disposable.** "You will build to persuade rather than to run in
    production. The POCs you make are usually thrown away." Production-grade concerns -
    error handling, idempotency, observability - which every other posting in the
    corpus treats as central, are explicitly not what this role is judged on. An
    extraction that imports them anyway has pattern-matched on "automation" rather
    than reading the posting.
  - **Platform experience is explicitly fungible.** "at least two of: iPaaS platforms,
    RPA, API integration patterns, or ETL. We do not mind which." A skill gap analysis
    that names specific products has contradicted a stated requirement.

  The genuinely required competencies are communication-shaped and all `stated`:
  building while explaining, holding technical and commercial conversations in one
  meeting, and telling an account executive a deal is not a fit. That last one is the
  third posting in the corpus to require refusal as a skill - alongside `jd-006` and
  `jd-009` - which is a recurrence worth noting given `PV §3.2` treats the same
  judgement as a product principle.

  Interview guidance has unusually direct evidence to work from: the process includes a
  45-minute live scenario exercise against a prospect requirement, which tells a
  candidate exactly what will be tested.

  Portfolio suggestions (`FR-022`: specific and buildable) are awkward here in an
  instructive way. The role's defining skill is performing under time pressure while
  narrating, which a portfolio artifact captures poorly. An honest response may say the
  useful preparation is a rehearsed build-and-explain rather than a built thing.

  Confidence `high`. CF-1 is strong: company stage and size, market, buyer profile,
  responsibilities, compensation structure, travel expectation, requirement split, and
  interview stages. CF-2 is strong - requirements are stated, including what is
  explicitly not required. CF-4 is strong: 180 people, £70,000 + £20,000, two-week
  evaluations, 45 minutes, twice monthly travel. No capping condition applies
  (`AI §8.3`).

