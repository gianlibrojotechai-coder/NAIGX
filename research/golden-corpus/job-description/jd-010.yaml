case_id: jd-010
input_type: job_description

content: |
  Solutions Engineer (Pre-Sales) — Workflow Automation Platform
  Remote (UK) with travel to customers roughly twice a month
  £70,000 base + £20,000 variable, uncapped

  Us

  We're a Series B workflow automation platform. Around 180 people, selling mid-market
  and lower enterprise across EMEA. Our buyers are usually operations or IT leaders who
  have already tried to solve the problem with something else.

  The role

  You sit with account executives and own the technical side of a deal. In practice:

  - Discovery calls where you work out what the prospect is actually trying to do, as
    distinct from the tool comparison they arrived with
  - Building proof-of-concept workflows against a prospect's real systems, usually
    inside a two-week evaluation window
  - Answering security and architecture questions from the prospect's IT function
  - Writing the technical sections of RFP responses
  - Feeding back to Product on what we lost deals over

  You will build, but you will build to persuade rather than to run in production. The
  POCs you make are usually thrown away.

  What we need

  - You can build a non-trivial integration quickly and explain it while you do
  - Genuine familiarity with at least two of: iPaaS platforms, RPA, API integration
    patterns, or ETL. We do not mind which
  - You can hold a technical conversation with a sceptical engineer and a commercial
    one with their director, sometimes in the same meeting
  - Comfortable telling an AE that we are not a fit for a deal

  Nice to have

  - Previous pre-sales or solutions consulting
  - Experience on the buying side of an automation platform decision

  Not required: quota-carrying sales experience. We will teach the commercial side.

  Process: intro call, a live scenario exercise (we give you a prospect's requirement
  and 45 minutes), and a panel.

