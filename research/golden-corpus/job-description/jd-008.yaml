rationale: |
  Materially different from the other postings on two axes the corpus does not
  otherwise cover: a **non-UK market** with its own employment vocabulary (W2, hourly
  rate, work authorisation, no sponsorship), and a **domain with mandatory technical
  standards** where the required knowledge is specified rather than transferable.

  Why the domain matters for `FR-022`. Every other posting names tools that are broadly
  substitutable — the corpus already establishes that Make, n8n and Zapier experience
  transfers. HL7 v2 and FHIR R4 do not work that way: they are standards with specific
  structures, and the posting says so explicitly ("we will ask you specific questions
  about segment mapping and resource references"). A skill gap analysis that treats
  them as interchangeable line items, or suggests adjacent integration experience
  substitutes, has misread a `stated` requirement.

  Three requirements resist mechanical extraction and carry most of the role's
  substance:
  - HIPAA operating experience, qualified as "including what you can and cannot log".
    That is a specific competence about observability under a regulatory constraint,
    not a compliance checkbox.
  - Production on-call ownership for what you build — a working-conditions requirement.
  - Translating in both directions with a non-technical clinical SME who owns the data
    model. The division of ownership is stated and shapes what the engineer decides.

  Portfolio suggestions are the hard test here (`FR-022`: specific and buildable, not
  categories). Clinical data is not something a candidate can practise on freely, and
  the honest answer may be that public FHIR test servers and synthetic datasets are the
  realistic route — or that a portfolio project is a weak signal for this role compared
  with demonstrable standards knowledge. Manufacturing a buildable project that ignores
  data availability would satisfy the artifact while failing the candidate.

  Confidence `high`. CF-1 is strong: company stage and size, engagement length and
  terms, rate band, team composition, twelve named intake paths with their formats,
  requirement split, and interview process. CF-2 is strong — Requirements and Preferred
  are separated explicitly, so both carry as `stated`. CF-4 is strong: $85–$105/hr,
  12 months, 400 employees, twelve intake paths, four years, three teams, 5+ years,
  90 minutes, six weeks. No capping condition applies (`AI §8.3`).

provenance:
  origin: synthetic
  notes: >
