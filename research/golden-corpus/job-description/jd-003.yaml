case_character: near-boundary
special_class: null

rationale: |
  Why near-boundary. Third case testing the near-boundary/ambiguous distinction, and
  the first where the competing type is `technical_assessment`. `ew-001` tested prose
  framing against running-system substance; `ta-003` tested informal framing against
  evaluation substance; this tests an embedded assessment-style problem against
  posting substance. Together they establish that the distinction is about which
  signals are decisive, not about how strong the competing signal feels.

  Artifact set. Job description path per `AI §9.1`, unchanged.

  Expected substance. `FR-022` requires must-have/nice-to-have classification with
  `stated`/`inferred` labels. This posting does not split them, unlike `jd-002`, so
  the split must be inferred and labelled `inferred` under `FR-013` - which makes this
  the corpus's test that provenance labelling reflects what the document actually
  states rather than defaulting to `stated`.

  Two requirements are stated but easy to under-weight. "Comfortable working without a
  test environment" is a working-conditions requirement, not a skill, and the
  undocumented 60-workflow estate implies discovery and reverse-engineering capability
  the posting never names. `FR-022` requires that where a posting is vague the output
  says so rather than inventing specificity - relevant here, since the rate is
  unstated and the seniority is implied only by the situation described.

  Interview guidance should address the architectural competencies the posting implies
  (`FR-022`), and the embedded stock-sync problem is direct evidence of what this
  employer will probe: incremental versus full-catalogue sync, throttling, overlapping
  runs, and staleness tolerance.

  Confidence `medium`. CF-1 is moderate: the technical estate is described concretely,
  but the role's scope beyond the first problem, the reporting line, and the rate are
  all absent. CF-2 is weakened by the unstated requirement split. CF-4 is mixed -
  strong on the scenario (11,000 SKUs, 15-minute polling, 9-minute run, 1,000 rpm
  throttle, 300 oversold lines), sparse on the role itself. No capping condition
  applies (`AI §8.3`).

provenance:
