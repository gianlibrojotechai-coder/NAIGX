expected_confidence_band: medium

expected_classification_confidence:
  bound: at_or_above_threshold
  threshold: 0.6
  rationale: >
    Near-boundary, not ambiguous, and the competing type here is `technical_assessment`
    rather than `business_requirement`. The "A problem to think about" section reads
    like an assessment brief - a scenario with concrete constraints and an invitation
    to explain an approach. But the surrounding document is decisively a contract
    posting: engagement length, IR35 status, required experience, availability, rate
    negotiation, and a start date. The problem section is a screening device embedded
    in a posting, not the document's purpose.

    Distinguishing this from `jd-001` matters. There, a complete automation requirement
    genuinely competed with a complete posting on substance. Here the embedded problem
    is explicitly framed as conversational - "not looking for a full design", "happy to
    talk it through" - which subordinates it to the hiring purpose rather than
    competing with it. Substance is decisive, so confidence should stay at or above
    threshold.

