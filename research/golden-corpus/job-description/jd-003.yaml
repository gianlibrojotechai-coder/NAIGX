case_id: jd-003
input_type: job_description

content: |
  Integration Engineer - contract, 6 months, outside IR35

  We need someone to sit with our operations team and untangle the integration layer
  between our ERP and everything else.

  The situation you'd be walking into: Business Central on the ERP side, a Magento
  storefront, a 3PL that only speaks flat-file over SFTP, and a middleware layer
  someone built in Azure Logic Apps that has grown to 60-odd workflows with no
  documentation and no environments other than production.

  A problem to think about

  Stock levels are shared between Business Central and Magento. Today a Logic App
  polls Business Central every 15 minutes and pushes the full catalogue to Magento -
  about 11,000 SKUs - which takes 9 minutes and occasionally overlaps with the next
  run. Magento's API throttles at 1,000 requests per minute. During Black Friday we
  oversold on 300 lines because stock was up to 15 minutes stale.

  How would you approach that? We're not looking for a full design, just how you'd
  frame it and what you'd want to know. Happy to talk it through rather than have
  you write it up.

  What we need from you

  - Strong Business Central integration experience, ideally including the OData and
    SOAP surfaces
  - Logic Apps or comparable iPaaS
  - Comfortable working without a test environment, because you won't have one for
    the first few weeks
  - Available at short notice

  Rate is negotiable and depends on experience. We'd want you starting within three
  weeks. Send availability and rate expectations.

