case_id: jd-007
input_type: job_description

content: |
  Operations Analyst (Automation) - entry level

  Leeds, 4 days on site · £26,000 - £29,000 · No prior commercial experience required

  We're a 300-person insurance intermediary. Our operations team processes policy
  documentation, and a lot of what they do could be automated. We've decided to build
  that capability internally rather than hire it in, which means training someone.

  This is a genuine entry-level role. We will teach you the tooling. What we can't
  teach easily is the mindset, so that's what we're recruiting for.

  What you'd actually do in year one

  Six months shadowing and working in the operations team itself - processing renewals,
  handling document requests, doing the job. We're serious about this. Every automation
  we've seen fail here was built by someone who didn't understand the work.

  Then six months building, supported by our two existing automation developers. Small
  things first: a document routing rule, a status notification, a reconciliation
  report. You'd own something small end to end by month nine.

  What we're looking for

  - Evidence you notice when something is done inefficiently, and that it bothers you
  - Comfortable with spreadsheets beyond the basics - lookups, pivot tables
  - Able to write clearly. You'll document what you build
  - Willing to spend six months doing the operational job before automating it

  You do not need: a degree, a programming background, or any experience with
  automation platforms.

  What we offer

  Structured training budget, day release for a relevant qualification if you want one,
  and a defined progression to Automation Developer at 18-24 months with a salary band
  attached to it.

  We hire for this role twice a year. Applications through our careers page.

