rationale: |
  Materially different from every other posting on one axis the corpus does not
  otherwise test: **seniority at the bottom of the range.** `jd-005` is a £75-85k
  functional head, `jd-002` and `jd-006` are experienced practitioners, `jd-003` a
  contractor, `jd-004` a freelance advert. This is entry level with no prior
  experience required and no platform named anywhere.

  Why it matters. `FR-022` requires skill gap analysis, portfolio recommendations and
  interview guidance. Every other posting supplies named tools that make those outputs
  easy to generate and easy to generate badly - by listing products. This posting names
  **no automation platform at all** and states outright that none is needed. An
  extraction that returns an empty or near-empty skill set has read the posting as a
  tool list; the requirements are real and stated, they are simply not technical:
  noticing inefficiency, intermediate spreadsheet ability, clear writing, and
  willingness to do the operational job first.

  The strongest signal is one a naive reading would drop entirely: six months working
  in operations before building anything, justified by "every automation we've seen fail
  here was built by someone who didn't understand the work". That is the posting's
  central requirement, it is `stated` under `FR-013`, and it should shape interview
  guidance more than any tool would.

  Portfolio suggestions are the interesting test. `FR-022` requires them "specific and
  buildable, not generic project categories". For a candidate with no programming
  background, buildable means something quite different from `jd-006`'s consultant -
  and a response that suggests building an n8n integration has ignored both the stated
  candidate profile and the employer's explicit "you do not need... any experience with
  automation platforms".

  Confidence `medium`, not `high`. CF-1 is moderate: company size, sector, salary,
  location, year-one structure, progression timeline and requirements are all stated,
  but no system, tool, volume, or process detail appears anywhere - by design. CF-2 is
  strong; what is stated is stated plainly. CF-4 is weak: the concrete values present
  are employment terms rather than anything about the work. Under `AI §8.4` absence
  lowers and never raises, and a posting this deliberately non-technical supports less
  confident extraction than `jd-002` or `jd-006`. No capping condition applies
  (`AI §8.3`).

