case_id: jd-005
input_type: job_description

content: |
  Head of Business Systems
  Bristol / hybrid (2 days on site) · £75,000 - £85,000 + car allowance + bonus

  About us

  We're a family-owned building products manufacturer, founded 1974, with four
  manufacturing sites in the UK and a distribution arm serving around 3,000 trade
  customers. Turnover is £140m and we employ 620 people. We were majority
  family-controlled until a private equity investment in 2024, and the new board has
  set a three-year plan that depends heavily on operational efficiency.

  Why this role exists

  We have grown by acquisition. Three of our four sites came in through acquisitions
  between 2016 and 2022, and each arrived with its own systems. We currently run two
  ERPs (Epicor at the two original sites, Infor at the others), three separate WMS
  installations, a CRM nobody trusts, and an unknown quantity of Access databases and
  spreadsheets that individual teams rely on. Month-end close takes eleven working
  days. The finance director describes the reporting position as "three versions of
  the truth and no way to reconcile them".

  This role is new. You would be the first person accountable for the systems estate
  as a whole rather than for one site or one function.

  What you would own

  - The systems roadmap, including the ERP consolidation decision. That decision has
    not been made and we are not assuming it must be Epicor.
  - Integration between whatever remains, including the interim state during any
    consolidation, which we expect to last two to three years.
  - A team of six: two business analysts, three developers, and one data analyst.
  - The automation agenda. There is appetite but no strategy - individual teams have
    built things in Power Automate and one site uses Zapier without IT's knowledge.
  - Vendor relationships and the associated budget, currently around £1.8m annually.

  What we are looking for

  Essential:
  - Experience owning a multi-site systems estate in manufacturing or distribution
  - Direct experience of an ERP consolidation or major migration, including the
    interim integration period
  - Credible with a board - you will present to ours quarterly
  - Track record of building capability in a team rather than delivering personally
  - Comfortable making a decision with incomplete information and defending it

  Desirable:
  - Exposure to private equity ownership and its reporting expectations
  - Familiarity with Epicor or Infor specifically
  - Data governance experience

  What we will not ask you to do

  We are not looking for someone to rip everything out in year one. The board's plan
  depends on the business continuing to operate through whatever change happens. If
  your instinct is a big-bang replacement, we are probably not the right fit.

  Process

  Two stages, plus a half-day on site meeting the team. We will pay for travel. We are
  working with one recruitment partner and applications direct to us are welcome.

