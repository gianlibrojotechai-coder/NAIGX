rationale: |
  Why substantial. Completes the `substantial` character for `job_description`, and is
  the densest posting in the corpus - the opposite pole from `jd-004` on the same path.
  It is also deliberately senior, where the corpus's other postings are practitioner
  roles, because `FR-022`'s outputs behave differently when the competencies implied
  are organisational rather than technical.

  Expected substance. `FR-022` requires must-have/nice-to-have classification labelled
  `stated` or `inferred`. This posting splits Essential from Desirable explicitly, so
  both carry as `stated` - as in `jd-002` and unlike `jd-003`.

  The more interesting test is what the posting implies but never states. Three
  requirements are organisational rather than technical - board credibility, building
  team capability rather than delivering personally, and defending decisions under
  incomplete information - and a skill gap analysis that returns only Epicor, Infor
  and Power Automate has read the posting as if it were `jd-004`. The "What we will
  not ask you to do" section is a stated constraint that reveals what the employer
  fears, and it should surface in interview guidance: a candidate whose instinct is
  big-bang replacement is explicitly disqualified.

  Portfolio suggestions must be specific and buildable (`FR-022`). At this seniority
  the honest response may be that a portfolio project is a poor fit for demonstrating
  multi-site estate ownership - and saying so would be better than manufacturing a
  buildable project to satisfy the artifact. Whether the system does that is worth
  observing; `FR-022` does not require an artifact to pretend its output is useful.

  Confidence `high`. CF-1 is strong: company background, turnover, headcount, site
  count, named systems, team composition, budget, ownership change, and an explicit
  reason the role exists. CF-2 is strong - the requirement split is stated. CF-4 is
  strong: £140m, 620 people, 3,000 customers, eleven-day close, £1.8m budget, six
  reports. No capping condition applies (`AI §8.3`).

