case_id: jd-002
input_type: job_description

content: |
  RevOps Automation Specialist

  Salford, UK - hybrid, 3 days on site
  £45,000 - £52,000 depending on experience

  We're a B2B SaaS company selling into UK manufacturing. Around 120 staff, Series B,
  growing fast enough that our revenue operations have started creaking.

  The role

  You'll own the systems that sit between marketing, sales and customer success. That
  means Salesforce as the system of record, Marketo for campaigns, Gong for call
  recording, and a fairly sprawling set of integrations that have grown up around
  them without much of a plan.

  Day to day you'll be building and maintaining those integrations, keeping the data
  clean enough that leadership can trust the pipeline reporting, and working with the
  three team leads to turn their process changes into working automations.

  Requirements

  - Demonstrable experience administering Salesforce in a commercial environment
  - Experience with a marketing automation platform - Marketo ideally, but HubSpot
    or Pardot experience transfers
  - Confident building integrations against REST APIs
  - Able to write SQL well enough to answer your own reporting questions
  - Comfortable pushing back when a requested automation is a bad idea

  Desirable

  - Experience in a Series A to C SaaS environment
  - Exposure to CPQ
  - Any scripting language

  What we offer

  25 days holiday plus bank holidays, private medical, £1,500 annual training budget,
  and a genuine say in how the stack evolves - we are not looking for someone to
  administer decisions other people have already made.

  To apply, send a CV to careers at our domain. No agencies.

