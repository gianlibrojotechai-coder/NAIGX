rationale: |
  Classification. Unambiguously a posting. This is the job-description-path baseline,
  read against which `jd-001`'s ambiguity and `jd-003`'s near-boundary framing are
  legible as departures from the norm.

  Artifact set. Job description path per `AI §9.1`, per `FR-022`.

  Expected substance. `FR-022` requires requirements extracted with
  `must-have`/`nice-to-have` classification, labelled `stated` or `inferred`. This
  posting separates "Requirements" from "Desirable" explicitly, so a correct response
  carries both as `stated` - inferring a split that the document already states would
  be a provenance error under `FR-013`.

  Two items resist mechanical extraction and are the more interesting test. "Comfortable
  pushing back when a requested automation is a bad idea" is a stated requirement that
  is not a tool skill, and "a genuine say in how the stack evolves" implies seniority
  the title does not convey. A skill gap analysis that lists only platforms has read
  the posting too literally.

  Portfolio suggestions must be specific and buildable rather than categories
  (`FR-022`) - grounded here in the named stack, so "a Salesforce-to-Marketo lead
  lifecycle sync with data quality checks" rather than "practise CRM integration".

  Confidence `high`. CF-1 is strong: named systems, company size and stage, team
  structure, explicit requirement split, and salary band. CF-2 is strong - the
  requirements are stated, not implied. CF-4 is strong: concrete named platforms
  rather than generic categories. No capping condition applies (`AI §8.3`).

