rationale: |
  Materially different from the other postings by **automation tradition**. Every other
  posting in the corpus is iPaaS, CRM-native, or bespoke integration. This is RPA -
  UiPath, orchestration, queues, screen-scraping - which is a distinct discipline with
  its own vocabulary and its own reasons for existing. `AI-042` and the corpus's
  platform-neutrality posture matter here: a system that treats RPA as an inferior form
  of automation would misread this posting, when in fact the estate exists precisely
  because the underlying systems have no APIs.

  Expected substance. `FR-022` requires must-have/nice-to-have classification labelled
  `stated` or `inferred`. Requirements and Desirable are separated explicitly, so both
  carry as `stated`.

  Three requirements carry the posting's real substance and resist tool-list
  extraction:
  - **Actionable exception handling**, stated as valued above "elegant happy paths".
    That is a design philosophy, not a skill, and it is the clearest statement of what
    this employer wants.
  - **Audit trail on an automated decision in a regulated business**, qualified with
    "and what that means for how you build". As in `jd-008`'s HIPAA logging
    requirement, this is a competence about building under constraint rather than a
    compliance checkbox.
  - **Willingness to say a process should not be automated** - the same judgement
    `jd-006` names and `PV §3.2` treats as a product principle.

  The posting's candour is itself information. "It is not glamorous and it breaks when
  the underlying system changes" and "if that sounds like friction, it will be" are
  stated working conditions that should surface in interview guidance. A response that
  presents this as a greenfield automation role has ignored what the employer went out
  of its way to say.

  Portfolio suggestions are constrained in a way worth noting (`FR-022`: specific and
  buildable). UiPath has a community edition, so building is possible - but
  demonstrating queue-based orchestration or a controlled-environment change process is
  not something a candidate can readily replicate, and an honest answer may say so
  rather than manufacture a project.

  Confidence `high`. CF-1 is strong: company size, team composition, estate size,
  process domains, technology, salary band, requirement split, and working conditions.
  CF-2 is strong - requirements are stated with their reasoning attached. CF-4 is
  strong: 2,200 staff, nine people, 70 processes, three-plus years, two days on site.
  No capping condition applies (`AI §8.3`).

provenance:
