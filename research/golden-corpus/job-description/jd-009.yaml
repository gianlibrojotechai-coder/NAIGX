case_id: jd-009
input_type: job_description

content: |
  RPA Developer - Financial Services
  Edinburgh, hybrid (2 days on site) · £52,000 - £62,000

  About the team

  We're the intelligent automation function inside a UK life and pensions business.
  Around 2,200 staff overall; our team is nine people - six developers, a business
  analyst, and two on the control side.

  We run an estate of roughly 70 UiPath processes in production, mostly in operations:
  policy administration, claims indexing, and a large amount of work that involves
  reading from systems that have no API and never will.

  The role

  You'd own a portfolio of processes end to end - build, hypercare, and ongoing
  support. Realistically that means half your time maintaining what exists and half
  building new.

  Some honesty about the estate: a lot of it is screen-scraping green-screen terminals
  and a mainframe front end. It is not glamorous and it breaks when the underlying
  system changes. We are gradually replacing the worst of it where APIs become
  available, but that is a multi-year direction, not a current project.

  Requirements

  - Three or more years building production RPA, UiPath specifically
  - Experience with attended and unattended orchestration, and with queue-based
    process design
  - Exception handling that a support team can actually action - we care about this
    more than elegant happy paths
  - Understanding of why a regulated business needs an audit trail on an automated
    decision, and what that means for how you build
  - Comfortable saying that a process should not be automated

  Desirable

  - Financial services, ideally life and pensions
  - Exposure to process mining
  - Any experience of migrating an RPA process to an API-based integration

  Working here

  This is a controlled environment. Changes go through CAB, you will write
  documentation, and there is a segregation of duties between build and production
  access. If that sounds like friction, it will be.

