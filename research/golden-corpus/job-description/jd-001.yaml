case_id: jd-001
input_type: job_description

content: |
  Automation Engineer (Operations) - Remote, UK

  About the role

  We're a 40-person logistics business and our operations run on too much manual
  work. We're hiring our first automation engineer to fix that.

  What you'll be doing

  Your first project will be our carrier booking process. At the moment our ops team
  copies shipment details from our TMS into three different carrier portals by hand,
  around 300 shipments a week, and re-keys the tracking numbers back into the TMS
  once the bookings are confirmed. We want this automated end to end, with exception
  handling when a carrier rejects a booking. After that, there's a similar problem
  with proof-of-delivery documents arriving by email that need filing against the
  right shipment record.

  You'll own these projects from design through to running them in production.

  What we're looking for

  - 3+ years building integrations between business systems
  - Strong with at least one automation platform (we use Make, but n8n or Workato
    experience transfers fine)
  - Comfortable with REST APIs, webhooks, and JSON
  - Able to talk to non-technical ops staff and work out what they actually need
  - Nice to have: experience in logistics or freight
  - Nice to have: Python for the cases where a platform isn't enough

  You'll report to the COO and work alongside two ops leads.

