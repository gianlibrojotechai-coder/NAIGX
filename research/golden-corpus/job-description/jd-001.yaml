  reason: >
    `risk_assessment` is not applicable to the job description path (`AI §9.1`)
    and is omitted for this case. Determinable, not unknown.

case_character: ambiguous
special_class: null

rationale: |
  Why this is deliberately ambiguous. The posting contains a fully-formed automation
  requirement embedded inside it - a named process, a volume (300 shipments a week),
  named systems, an explicit end-to-end goal, and an exception-handling requirement.
  Read in isolation, that paragraph is a `business_requirement`. The surrounding
  document is unambiguously a job posting: a role title, reporting line, years of
  experience, and must-have versus nice-to-have criteria.

  Expected classification is `job_description`. The decisive test is what the
  submitter is asking for. The document's purpose is to describe a role and its
  requirements; the process description is context establishing what the hire will
  work on, not a request to design that automation. A classifier that keys on the
  richest technical content rather than document purpose will misclassify this, and
  that is precisely the failure this case is built to catch.

  This is genuinely contestable, and deliberately so. `AI §12.2` requires
  "deliberately ambiguous cases", and a case whose correct answer is obvious would
  not be one. The expectation is recorded with its reasoning so a future maintainer
  can see it was a considered judgement rather than an oversight - and can challenge
  it under `docs/11` §6.2 if the reasoning turns out to be wrong.

  Artifact set. `FR-022` requires required-skill extraction, skill gap analysis,
  portfolio recommendations and interview guidance. `AI §9.1` maps the job
  description path to exactly `skill_gap_analysis`, `portfolio_suggestions` and
  `interview_guidance`; skill extraction is an input to those rather than a separate
  catalogue artifact. Every other artifact is omitted on path grounds.

  Expected substance. `FR-022` requires must-have/nice-to-have classification with
  `stated`/`inferred` labels. The posting states both explicitly, so a correct
  response should carry them as `stated` rather than inferring. Portfolio suggestions
  must be specific and buildable, not categories - "build a carrier booking
  integration with exception handling" rather than "practise API integration".

  Confidence `medium`. CF-2 is the limiting factor: while the posting is detailed,
  the classification itself rests on an inferred reading of document purpose, and
  several role expectations are implied rather than stated. No capping condition
  applies (`AI §8.3`); this is a base-confidence judgement.

  Gap G-3, resolved 2026-08-12. The expectation that classification confidence falls
  below the `FR-015` threshold - the most important thing to assert about a
  deliberately ambiguous case - is now recorded explicitly in
  `expected_classification_confidence` rather than merely implied by the confidence
  band. See `docs/11` §4.4.

provenance:
  origin: synthetic
  notes: >
