expected_confidence_band: medium

expected_classification_confidence:
  bound: below_threshold
  threshold: 0.6
  rationale: >
    This is the expectation the case exists to assert. The document carries strong,
    genuinely competing signals: a complete automation requirement (named process,
    300 shipments a week, named systems, explicit end-to-end goal) embedded in an
    unambiguous job posting (role title, reporting line, years of experience,
    must-have versus nice-to-have criteria). A correctly calibrated classifier
    should register that competition as reduced confidence and fall below the
    `FR-011` 0.6 threshold, triggering the `FR-015` confirmation path.

    A high-confidence classification here would be a calibration failure even if
    the chosen type were `job_description` — confidently correct for the wrong
    reason is the over-confidence `AI §8.5` classifies as severe.

    Note this is independent of `expected_confidence_band: medium`, which concerns
    the analysis rather than the type. This case expects low classification
    confidence and medium analysis confidence simultaneously.

expected_complexity:
  status: not_applicable
  reason: >
    `complexity_score` is not applicable to the job description path (`AI §9.1`)
    and is omitted for this case. Determinable, not unknown.

expected_risk:
