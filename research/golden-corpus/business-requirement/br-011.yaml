    The `risk_assessment` artifact is expected, and the stated consequences are
    unusually severe - an invalidated Section 21 notice, or criminal liability for a
    landlord. Nothing in `docs/09` §2 maps a stated consequence onto a severity or
    likelihood value, so asserting one would invent scoring guidance.

case_character: central
special_class: null

rationale: |
  Materially different from the other requirement-path cases by the shape of the
  problem: this is **deadline-driven compliance chasing**, where the automation's job
  is to notice that something has not happened rather than to process something that
  has. `br-001` routes documents that arrive, `br-008` matches confirmations that
  arrive, `br-009` reconciles payments that arrive. Here the failure is silence -
  40 properties never chased because a field was blank.

  Expected substance. Four things any grounded response must engage, all stated:

  - **The blank-field failure is the core problem.** Expiry tracking that depends on
    correct data entry cannot detect its own gaps. This is the same class of defect as
    `ew-007`'s missing dealer file - absence read as "nothing to do" - and a response
    that improves the chase sequence without addressing detection has fixed the
    visible half.
  - **Read-only API access.** The submitter states their Reapit licence tier permits
    read only, and that the upgrade is uncosted. Any design that writes expiry dates
    back into Reapit contradicts a stated constraint, and `platform_comparison` must
    work within it. This is the constraint most likely to be read past.
  - **Uncontrollable inbound format.** Contractors send PDFs "in whatever format they
    like" and the submitter states they cannot dictate otherwise. Extraction is
    therefore a fixed requirement, not a design choice.
  - **No IT function.** Six property managers and one office manager. As in `br-001`
    and `br-008`, this materially narrows what is maintainable and must be labelled
    `stated` under `FR-013`.

  The verification requirement - checking a filed certificate matches the property and
  date recorded - is the hardest part and the easiest to skip. It is not document
  routing; it is a correctness check against the record, and a design that files PDFs
  without it has answered two of the three requests.

  Confidence `high`. CF-1 is strong: portfolio size, landlord count, certificate types
  with periodicities, current process, a quantified failure, team size, and named
  system with its access limitation. CF-2 is strong - constraints are stated rather
  than inferred. CF-4 is strong: 1,400, 300, 60 days, 40 properties, six plus one.
  No capping condition applies (`AI §8.3`); the constraints are restrictive but
  mutually consistent.

provenance:
