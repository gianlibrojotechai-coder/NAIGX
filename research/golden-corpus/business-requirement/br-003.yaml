case_character: central
special_class: do-not-automate

rationale: |
  Classification. A desired future capability, `business_requirement`. The submitter
  is asking what an automated version would look like, which is a requirement even
  though the correct answer is that it should not be built.

  Why `do-not-automate` and not `insufficient`. The distinction in `docs/11` §3 is
  strict. This input is not insufficient - it is complete. Frequency (annual),
  volume (four policies, one broker), effort (90 minutes plus a one-hour meeting),
  and systems are all stated. The system has everything it needs to reason, and the
  reasoning concludes that the economics do not justify automation: roughly 2.5
  hours of effort once a year, against building and maintaining an integration.
  A refusal here would be wrong - the correct behaviour is a confident negative
  conclusion, not a refusal to answer.

  The judgement itself is grounded in the submitter's own numbers, not in a
  general preference. `PV §3.2` treats over-production as a defect, and `FR-020`
  requires the system to state that automation is unwarranted rather than produce
  a design.

  Confidence `high`. No capping condition applies (`AI §8.3`): no contradictions,
  no material unknowns. CF-1 and CF-4 are strong - the numbers needed to reach the
  conclusion are all stated. High confidence in a negative conclusion is the correct
  outcome, and hedging it would misrepresent how well-supported it is.

  Artifact set governed by `docs/11` §3.1, which resolves former ambiguities A-6 and
  A-8. The rule turns on whether an artifact presupposes a design: `business_analysis`
  explains the requirement and carries the negative conclusion, while the five omitted
  design artifacts cannot be constructed without the design `FR-020` requires the
  system to withhold. Four of the five exclusions are structural rather than
  editorial - `mermaid_diagram` requires nodes matching architecture components,
  `risk_assessment` requires a non-nullable `component_id` (`DB §4.3`),
  `complexity_score` scores a proposed solution (`docs/09` §1), and
  `platform_comparison` would recommend a platform on which to build.

  This case's artifact set was reviewed against §3.1 on 2026-08-12 and required no
  change.

provenance:
  origin: synthetic
  notes: >
    Authored for the corpus. Frequency and effort figures chosen so the negative
    conclusion follows from stated evidence rather than from judgement about the
    domain.

