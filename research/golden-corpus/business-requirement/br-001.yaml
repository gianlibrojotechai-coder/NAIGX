rationale: |
  Classification. The input describes a desired future capability, not an existing
  automation to review and not a hiring artifact. It is squarely `business_requirement`
  with no competing signal.

  Artifact set. `FR-020` requires business analysis, architecture, platform
  recommendation, risk analysis and complexity score for a non-trivial requirement.
  `AI §9.1` lists `mermaid_diagram` as applicable to the requirement path, and
  `FR-031` makes it P0. The four P1 artifacts are omitted per `MVP §5.3`.

  Confidence `high`. Assessed against the `AI §8.2` factors:
  - CF-1 input completeness: high. Volumes, systems, constraints, approval
    thresholds, budget and team capability are all present.
  - CF-2 requirement clarity: high. Nearly every context element is `stated`
    rather than `inferred`.
  - CF-3 conflicting information: none. No requirement contradicts another.
  - CF-4 evidence quality: high. Concrete values throughout - 400-500 invoices,
    £10,000 and £50,000 thresholds, 5-9 day approval times, £400/month budget.
  - CF-7 unknown materiality: no material unknown blocks a recommendation.
  With no capping condition present (`AI §8.3`), `high` is the correct band.

  This case is the baseline. If it does not produce a full, confident, grounded
  analysis, nothing else in the corpus will.

