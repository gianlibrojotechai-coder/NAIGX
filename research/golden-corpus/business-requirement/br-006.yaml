expected_complexity:
  status: not_determinable
  scale_version: complexity-v1
  reason: >
    The `complexity_score` artifact is expected, and this input supplies unusually
    strong signals for several `docs/09` §1.1 factors - two intake modes, HL7 plus a
    partial REST API, protocol rules outside the API surface, and a regulatory
    boundary. But no authoritative rule maps those characteristics onto factor scores
    on the 1-5 scale, and `docs/09` A-3 records that no calibration data exists.
    Asserting values would be guessing. Corpus-wide deterministic assertions
    (`docs/11` §4.5) still apply.

expected_risk:
  status: not_determinable
  scale_version: risk-v1
  reason: >
    The `risk_assessment` artifact is expected. The input names conditions that
    plainly warrant risks - unattended clinical booking, extraction from handwritten
    documents, data residency - but nothing in `docs/09` §2 or `FR-032` maps a stated
    condition onto a severity or likelihood value.

case_character: substantial
special_class: null

rationale: |
  Why substantial. Long, structured, and detailed across background, volumes, current
  process, requirements, constraints and success criteria. It is the requirement-path
  counterpart to `ta-002` and the opposite pole from `br-004`, and the three together
  are what make proportionality (`FR-017`, `AC-037`) testable across the range.

  Why this is not `existing_workflow`. Worth stating because the current-process
  section is detailed enough to invite misclassification. `FR-021` covers inputs
  submitting an existing automation for review; this describes manual work being
  replaced. The decisive signal is the "What we need" section, which is entirely
  forward-looking.

  Artifact set. Full P0 requirement-path set per `FR-020` and `AI §9.1`. Unlike
  `br-004`, this is unambiguously "non-trivial" in `FR-020`'s sense, so no
  proportionality reduction applies.

  Expected substance. Three things any grounded response must engage, all stated:
  the deliberate asymmetry between unattended structured intake and human-confirmed
  unstructured intake; the protocol rules sitting outside the REST API, which
  constrains any design that assumes full API coverage; and the UK data residency and
  DPA requirement, which constrains processor selection and therefore
  `platform_comparison`. A response recommending a platform without addressing the
  DPA constraint fails rubric criterion C-1 (Grounded).

  The stated development capacity - two people, both committed until year end - is
  material to any recommendation and is the kind of constraint that is easy to read
  past. `FR-013` provenance labelling should mark it `stated`.

  Confidence `high`. CF-1 is strong: volumes, per-referral timings, staffing, systems,
  interfaces, regulatory obligations and success criteria are all present. CF-2 is
  strong - nearly everything is stated rather than inferred. CF-4 is strong: 31,400
  referrals, 62/26/12 split, 15% growth, 30 per person per day, four versus twelve to
  twenty minutes. No capping condition applies (`AI §8.3`): the requirements are
  demanding but mutually consistent, and no material unknown blocks a recommendation.

