  reason: >
    The `complexity_score` artifact is expected. Four ingestion channels, a fuzzy
    matching problem, and a regulatory eligibility rule are strong signals for several
    `docs/09` §1.1 factors, but no authoritative rule maps them onto 1-5 factor scores
    and `docs/09` A-3 records that no calibration data exists.

expected_risk:
  status: not_determinable
  scale_version: risk-v1
  reason: >
    The `risk_assessment` artifact is expected. Incorrectly claiming Gift Aid is a
    matter for HMRC rather than an internal inconvenience, and the known-incomplete
    declaration data is a stated condition - but nothing in `docs/09` §2 maps a stated
    condition onto a severity or likelihood value.

case_character: central
special_class: null

rationale: |
  Materially different from the other requirement-path cases: `br-001` is document
  capture and approval routing, `br-006` is regulated clinical intake, `br-007` is
  estimation with irreducible human judgement, `br-008` is exception-only matching at
  volume. This one is financial reconciliation plus a statutory claim, and its
  distinguishing feature is that the correct answer is almost certainly a **partial**
  automation with a manual submission step the submitter has already identified.

  Expected substance. Four things any grounded response must engage, all stated:

  - The 8% unmatched rate and 340 exceptions from 4,100 transactions establish where
    the value is. As in `br-008`, the asymmetry between the matchable majority and the
    exception tail determines the design.
  - Standing order references being unreliable - surnames, stale references - is a
    data-quality constraint that bounds what automatic matching can achieve. A
    response promising full automatic reconciliation has ignored it.
  - The 2019 migration left declarations incomplete. Gift Aid eligibility depends on
    them, so this is not a peripheral data issue; it is the constraint on the second
    objective.
  - The submitter states HMRC submission may have to stay manual. `PV §3.2` treats
    over-production as a defect, and a design that invents an HMRC integration the
    submitter has already doubted would be exactly that.

  The £6,000 budget materially narrows `platform_comparison` and must be labelled
  `stated` under `FR-013`. Salesforce NPSP is fixed, so the comparison is about what
  connects to it, not whether to replace it.

  Confidence `high`. CF-1 is strong: four named channels, named CRM and bank, income
  figures, transaction volumes, unmatched rate, claim effort, budget, and regulatory
  obligations. CF-2 is strong - the constraints are stated rather than inferred. CF-4
  is strong: £6m, £2.1m, 8%, 340 of 4,100, eleven days, £6,000. No capping condition
  applies (`AI §8.3`): the objectives are demanding but consistent, and the unknowns
  named - which declarations are missing - are what the system is being asked to
  surface rather than obstacles to reasoning.

provenance:
